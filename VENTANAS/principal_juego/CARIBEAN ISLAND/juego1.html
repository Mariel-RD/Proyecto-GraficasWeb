<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Caribean Island - Juego 1</title>
	<link rel="stylesheet" href="caribean_island_styles.css">
	<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/MTLLoader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/OBJLoader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/FBXLoader.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
	<script src="/socket.io/socket.io.js"></script>
</head>
<body>
	<canvas id="gameCanvas"></canvas>
	<div class="game-hud">
		<div class="settings-profile-row">
			<div class="game-settings-card" aria-live="polite">
				<div><strong>Dificultad:</strong> <span id="currentDifficulty">Normal</span></div>
				<div><strong>Musica:</strong> <span id="currentMusic">70</span></div>
				<div><strong>Efectos:</strong> <span id="currentSfx">75</span></div>
				<div><strong>Pantalla completa:</strong> <span id="currentFullscreen">No</span></div>
			</div>
			<button class="profile-photo-button" type="button" aria-label="Perfil del jugador">
				<img src="img/foto perfil muestra.webp" alt="Foto de perfil del jugador">
			</button>
		</div>

		<header class="hud-top">
			<div class="hud-group">
				<button class="game-button game-button-image" id="inventoryButton" type="button">Inventario</button>
				<button class="game-button game-button-image" type="button">Mapa</button>
			</div>
			<div class="hud-group">
				<button class="game-button game-button-pause" id="pauseButton" type="button" aria-label="Pausa"></button>
			</div>
		</header>

		<div class="game-stats-card" aria-live="polite">
			<div class="stats-text-row"><strong>Nombre:</strong> <span id="currentPlayerName">Jugador</span></div>
			<div class="stats-text-row"><strong>Vida:</strong> <span id="lifeCount">100</span></div>
		</div>

		<footer class="hud-bottom">
			<div class="movement-controls">
				<img class="wasd-hint" src="img/wasd.png" alt="Controles WASD">
				<div class="hud-group">
					<button class="game-button game-button-soft" type="button">Correr</button>
					<button class="game-button game-button-soft" type="button">Agacharse</button>
				</div>
			</div>
			<div class="hud-group hud-group-actions">
				<button class="game-button game-button-main game-button-image" id="interactButton" type="button">Interactuar</button>
				<button class="game-button game-button-image" id="reactionsButton" type="button">Reacciones</button>
			</div>
		</footer>

		<section class="chat-popup" id="chatPopup" aria-live="polite" aria-label="Chat rapido">
			<div class="chat-popup-header">
				<span>Chat</span>
				<button class="chat-close" id="closeChatButton" type="button" aria-label="Cerrar chat">x</button>
			</div>
			<div class="chat-messages" id="chatMessages">
				<div class="chat-message npc">Jugador2: Aqui hay un camino hacia las ruinas</div>
			</div>
			<form class="chat-input-row" id="chatForm">
				<input id="chatInput" type="text" maxlength="120" placeholder="Escribe..." autocomplete="off">
				<button class="chat-send" type="submit">Enviar</button>
			</form>
		</section>

		<section class="reactions-popup" id="reactionsPopup" aria-label="Inventario de reacciones">
			<div class="reactions-popup-header">
				<span>Reacciones</span>
				<button class="reactions-close" id="closeReactionsButton" type="button" aria-label="Cerrar reacciones">x</button>
			</div>
			<div class="reactions-grid">
				<button class="reaction-item" type="button">Silbar</button>
				<button class="reaction-item" type="button">Saludar</button>
				<button class="reaction-item" type="button">Senalar</button>
				<button class="reaction-item" type="button">Distraer</button>
				<button class="reaction-item" type="button">Burlarse</button>
				<button class="reaction-item" type="button">Callar</button>
			</div>
		</section>

		<section class="inventory-popup" id="inventoryPopup" aria-label="Inventario del jugador">
			<div class="inventory-popup-header">
				<span>Inventario</span>
				<button class="inventory-close" id="closeInventoryButton" type="button" aria-label="Cerrar inventario">x</button>
			</div>
			<div class="inventory-grid">
				<button class="inventory-slot" type="button">Key</button>
				<button class="inventory-slot" type="button">Map</button>
				<button class="inventory-slot" type="button">Note</button>
				<button class="inventory-slot" type="button"></button>
				<button class="inventory-slot" type="button"></button>
				<button class="inventory-slot" type="button"></button>
				<button class="inventory-slot" type="button"></button>
				<button class="inventory-slot" type="button"></button>
				<button class="inventory-slot" type="button"></button>
			</div>
		</section>

		<section class="pause-modal" id="pauseModal" aria-label="Menu de pausa">
			<div class="pause-menu-panel">
				<img class="pause-modal-image" src="img/MENU-PAUSA.png" alt="Menu de pausa">
				<div class="pause-menu-actions">
					<button class="pause-menu-btn" id="pauseResumeButton" type="button">Reanudar</button>
					<button class="pause-menu-btn" id="pauseRestartButton" type="button">Reiniciar</button>
					<button class="pause-menu-btn" id="pauseOptionsButton" type="button">Opciones</button>
					<button class="pause-menu-btn" id="pauseExitButton" type="button">Salir</button>
				</div>
			</div>
		</section>

		<section class="game-over-modal" id="gameOverModal" aria-label="Juego terminado">
			<div class="game-over-panel">
				<h2 id="gameOverTitle">Juego terminado</h2>
				<p id="gameOverMessage">Tiempo agotado</p>
				<p id="gameOverScores"></p>
				<div class="game-over-actions">
					<button class="pause-menu-btn" id="gameOverRestartButton" type="button">Reiniciar</button>
					<button class="pause-menu-btn" id="gameOverExitButton" type="button">Salir</button>
				</div>
			</div>
		</section>

		<div id="pauseOptionsModal" class="options-modal" aria-hidden="true">
			<div class="options-panel" role="dialog" aria-modal="true" aria-labelledby="pauseOptionsTitle">
				<img class="options-panel-image" src="../../menu_inicial/img/MENU-OPTIONS.png" alt="Panel de opciones">
				<div class="options-panel-content">
					<div class="options-header">
						<img id="pauseOptionsTitle" class="options-title-image" src="../../menu_inicial/img/options.png" alt="Opciones">
						<button id="closePauseOptionsButton" class="close-modal-button" type="button" aria-label="Cerrar">
							x
						</button>
					</div>

					<div class="options-content">
						<label class="option-row">
							<span>Musica</span>
							<input id="pauseMusicRange" type="range" min="0" max="100" value="70">
						</label>

						<label class="option-row">
							<span>Efectos de sonido</span>
							<input id="pauseSfxRange" type="range" min="0" max="100" value="75">
						</label>

						<label class="option-row">
							<span>Dificultad</span>
							<select id="pauseDifficultySelect">
								<option>Facil</option>
								<option selected>Normal</option>
								<option>Dificil</option>
							</select>
						</label>

						<label class="option-row option-check">
							<span>Pantalla completa</span>
							<input id="pauseFullscreenCheck" type="checkbox">
						</label>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		const gameParams = new URLSearchParams(window.location.search);
		const currentPlayerName = document.getElementById("currentPlayerName");
		const currentDifficulty = document.getElementById("currentDifficulty");
		const currentMusic = document.getElementById("currentMusic");
		const currentSfx = document.getElementById("currentSfx");
		const currentFullscreen = document.getElementById("currentFullscreen");
		const pauseButton = document.getElementById("pauseButton");
		const inventoryButton = document.getElementById("inventoryButton");
		const interactButton = document.getElementById("interactButton");
		const reactionsButton = document.getElementById("reactionsButton");
		const chatPopup = document.getElementById("chatPopup");
		const reactionsPopup = document.getElementById("reactionsPopup");
		const inventoryPopup = document.getElementById("inventoryPopup");
		const pauseModal = document.getElementById("pauseModal");
		const gameOverModal = document.getElementById("gameOverModal");
		const gameOverTitle = document.getElementById("gameOverTitle");
		const gameOverMessage = document.getElementById("gameOverMessage");
		const gameOverScores = document.getElementById("gameOverScores");
		const gameOverRestartButton = document.getElementById("gameOverRestartButton");
		const gameOverExitButton = document.getElementById("gameOverExitButton");
		const pauseResumeButton = document.getElementById("pauseResumeButton");
		const pauseRestartButton = document.getElementById("pauseRestartButton");
		const pauseOptionsButton = document.getElementById("pauseOptionsButton");
		const pauseExitButton = document.getElementById("pauseExitButton");
		const pauseOptionsModal = document.getElementById("pauseOptionsModal");
		const closePauseOptionsButton = document.getElementById("closePauseOptionsButton");
		const pauseDifficultySelect = document.getElementById("pauseDifficultySelect");
		const pauseMusicRange = document.getElementById("pauseMusicRange");
		const pauseSfxRange = document.getElementById("pauseSfxRange");
		const pauseFullscreenCheck = document.getElementById("pauseFullscreenCheck");
		const closeChatButton = document.getElementById("closeChatButton");
		const closeReactionsButton = document.getElementById("closeReactionsButton");
		const closeInventoryButton = document.getElementById("closeInventoryButton");
		const chatForm = document.getElementById("chatForm");
		const chatInput = document.getElementById("chatInput");
		const chatMessages = document.getElementById("chatMessages");
		const reactionItems = document.querySelectorAll(".reaction-item");

		const difficultyValue = gameParams.get("difficulty") || "Normal";
		const musicValue = gameParams.get("music") || "70";
		const sfxValue = gameParams.get("sfx") || "75";
		const fullscreenValue = gameParams.get("fullscreen") === "1" ? "Si" : "No";
		const playerNameValue = (gameParams.get("playerName") || localStorage.getItem("playerName") || sessionStorage.getItem("playerName") || "Jugador").trim() || "Jugador";
		const sfxVolume = Math.max(0, Math.min(100, Number(sfxValue) || 0)) / 100;
		const localPlayerId = sessionStorage.getItem("multiplayerPlayerId") || (
			window.crypto && typeof window.crypto.randomUUID === "function"
				? window.crypto.randomUUID()
				: String(Date.now()) + Math.random().toString(16).slice(2)
		);
		const multiplayerRoom = localStorage.getItem("multiplayerRoom") || "caribean-island-room";
		const multiplayerServerUrl = localStorage.getItem("multiplayerServerUrl") || window.location.origin;
		const socket = typeof io === "function"
			? io(multiplayerServerUrl, { transports: ["websocket", "polling"] })
			: null;

		sessionStorage.setItem("multiplayerPlayerId", localPlayerId);
		localStorage.setItem("multiplayerRoom", multiplayerRoom);

		let uiAudioContext;

		function addPlayerMessage(message) {
			const playerMessage = document.createElement("div");
			playerMessage.className = "chat-message player";
			playerMessage.textContent = "Tu: " + message;
			chatMessages.appendChild(playerMessage);
			chatMessages.scrollTop = chatMessages.scrollHeight;
		}

		function addSystemMessage(message) {
			const systemMessage = document.createElement("div");
			systemMessage.className = "chat-message npc";
			systemMessage.textContent = message;
			chatMessages.appendChild(systemMessage);
			chatMessages.scrollTop = chatMessages.scrollHeight;
		}

		function playReactionSound() {
			if (sfxVolume <= 0) {
				return;
			}

			if (!uiAudioContext) {
				const AudioContextClass = window.AudioContext || window.webkitAudioContext;
				if (!AudioContextClass) {
					return;
				}
				uiAudioContext = new AudioContextClass();
			}

			const startTime = uiAudioContext.currentTime;
			const oscillator = uiAudioContext.createOscillator();
			const gain = uiAudioContext.createGain();

			oscillator.type = "triangle";
			oscillator.frequency.setValueAtTime(620, startTime);
			oscillator.frequency.exponentialRampToValueAtTime(780, startTime + 0.08);

			gain.gain.setValueAtTime(0.0001, startTime);
			gain.gain.exponentialRampToValueAtTime(Math.max(0.01, sfxVolume * 0.18), startTime + 0.02);
			gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.14);

			oscillator.connect(gain);
			gain.connect(uiAudioContext.destination);

			oscillator.start(startTime);
			oscillator.stop(startTime + 0.14);
		}

		currentDifficulty.textContent = difficultyValue;
		currentMusic.textContent = musicValue;
		currentSfx.textContent = sfxValue;
		currentFullscreen.textContent = fullscreenValue;
		currentPlayerName.textContent = playerNameValue;
		document.title = "Caribean Island - " + playerNameValue;

		let isGameOver = false;
		let remainingSeconds = 60;
		let roomTimerStartedAt = Date.now();
		let roomTimerDurationSeconds = 60;
		let roomTimerServerOffset = 0;

		function finishGame() {
			if (isGameOver) {
				return;
			}

			isGameOver = true;
			gameOverTitle.textContent = "Juego terminado";
			gameOverMessage.textContent = "Tiempo agotado";
			gameOverScores.textContent = "";

			chatPopup.classList.remove("is-open");
			reactionsPopup.classList.remove("is-open");
			inventoryPopup.classList.remove("is-open");
			pauseModal.classList.remove("is-open");
			pauseOptionsModal.classList.remove("is-open");
			gameOverModal.classList.add("is-open");
		}

		function applyRoomTimer(timer) {
			if (!timer || typeof timer.startedAt !== "number" || typeof timer.durationSeconds !== "number") {
				return;
			}

			roomTimerStartedAt = timer.startedAt;
			roomTimerDurationSeconds = timer.durationSeconds;
			roomTimerServerOffset = (typeof timer.serverNow === "number" ? timer.serverNow : Date.now()) - Date.now();
			updateSharedTimer();
		}

		function updateSharedTimer() {
			const estimatedServerNow = Date.now() + roomTimerServerOffset;
			const elapsedSeconds = Math.floor((estimatedServerNow - roomTimerStartedAt) / 1000);
			remainingSeconds = Math.max(0, roomTimerDurationSeconds - elapsedSeconds);
			if (remainingSeconds === 0) {
				finishGame();
			}
		}

		updateSharedTimer();
		setInterval(function () {
			if (!isGameOver) {
				updateSharedTimer();
			}
		}, 1000);

		interactButton.addEventListener("click", function () {
			inventoryPopup.classList.remove("is-open");
			reactionsPopup.classList.remove("is-open");
			chatPopup.classList.add("is-open");
			chatInput.focus();
		});

		reactionsButton.addEventListener("click", function () {
			inventoryPopup.classList.remove("is-open");
			chatPopup.classList.remove("is-open");
			reactionsPopup.classList.add("is-open");
		});

		inventoryButton.addEventListener("click", function () {
			pauseModal.classList.remove("is-open");
			chatPopup.classList.remove("is-open");
			reactionsPopup.classList.remove("is-open");
			inventoryPopup.classList.add("is-open");
		});

		pauseButton.addEventListener("click", function () {
			pauseOptionsModal.classList.remove("is-open");
			chatPopup.classList.remove("is-open");
			reactionsPopup.classList.remove("is-open");
			inventoryPopup.classList.remove("is-open");
			pauseModal.classList.add("is-open");
		});

		pauseModal.addEventListener("click", function (event) {
			if (event.target === pauseModal) {
				pauseModal.classList.remove("is-open");
			}
		});

		pauseResumeButton.addEventListener("click", function () {
			pauseModal.classList.remove("is-open");
		});

		pauseRestartButton.addEventListener("click", function () {
			location.reload();
		});

		pauseOptionsButton.addEventListener("click", function () {
			pauseModal.classList.remove("is-open");
			pauseOptionsModal.setAttribute("aria-hidden", "false");
			pauseDifficultySelect.value = currentDifficulty.textContent;
			pauseMusicRange.value = currentMusic.textContent;
			pauseSfxRange.value = currentSfx.textContent;
			pauseFullscreenCheck.checked = currentFullscreen.textContent === "Si";
			pauseOptionsModal.classList.add("is-open");
		});

		function closePauseOptionsModal() {
			pauseOptionsModal.classList.remove("is-open");
			pauseOptionsModal.setAttribute("aria-hidden", "true");
			pauseModal.classList.add("is-open");
		}

		pauseOptionsModal.addEventListener("click", function (event) {
			if (event.target === pauseOptionsModal) {
				closePauseOptionsModal();
			}
		});

		closePauseOptionsButton.addEventListener("click", function () {
			closePauseOptionsModal();
		});

		pauseDifficultySelect.addEventListener("change", function () {
			currentDifficulty.textContent = pauseDifficultySelect.value;
		});

		pauseMusicRange.addEventListener("input", function () {
			currentMusic.textContent = pauseMusicRange.value;
		});

		pauseSfxRange.addEventListener("input", function () {
			currentSfx.textContent = pauseSfxRange.value;
		});

		pauseFullscreenCheck.addEventListener("change", function () {
			currentFullscreen.textContent = pauseFullscreenCheck.checked ? "Si" : "No";
		});

		pauseExitButton.addEventListener("click", function () {
			window.location.href = "../../menu_inicial/index.html";
		});

		gameOverRestartButton.addEventListener("click", function () {
			if (socket && socket.connected) {
				socket.emit("restart-game", { room: multiplayerRoom });
				setTimeout(function () {
					location.reload();
				}, 250);
				return;
			}

			location.reload();
		});

		gameOverExitButton.addEventListener("click", function () {
			window.location.href = "../../menu_inicial/index.html";
		});

		closeChatButton.addEventListener("click", function () {
			chatPopup.classList.remove("is-open");
		});

		closeReactionsButton.addEventListener("click", function () {
			reactionsPopup.classList.remove("is-open");
		});

		closeInventoryButton.addEventListener("click", function () {
			inventoryPopup.classList.remove("is-open");
		});

		// --- MOTOR 3D (Three.js) ---
		const canvas = document.getElementById("gameCanvas");
		const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.setPixelRatio(window.devicePixelRatio);
		renderer.shadowMap.enabled = true;
		renderer.setClearColor(0x2b3b2f, 1);
		renderer.outputEncoding = THREE.sRGBEncoding;

		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x2b3b2f);
		scene.fog = new THREE.Fog(0x2b3b2f, 40, 170);

		const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
		camera.position.set(0, 6, 12);

		const ambientLight = new THREE.AmbientLight(0x8dbb7a, 0.65);
		scene.add(ambientLight);

		const sunLight = new THREE.DirectionalLight(0xffd2a0, 1.1);
		sunLight.position.set(80, 120, 50);
		sunLight.castShadow = true;
		scene.add(sunLight);

		const textureLoader = new THREE.TextureLoader();
		const floorTexture = textureLoader.load("../../../imagenes/texturas-Mapa/jungle_ground.png");
		floorTexture.encoding = THREE.sRGBEncoding;
		floorTexture.wrapS = THREE.RepeatWrapping;
		floorTexture.wrapT = THREE.RepeatWrapping;
		const repeatX = 20;
		const repeatY = 20;
		floorTexture.repeat.set(repeatX, repeatY);
		floorTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
		floorTexture.minFilter = THREE.LinearMipMapLinearFilter;
		floorTexture.magFilter = THREE.LinearFilter;

		const floorMaterial = new THREE.MeshStandardMaterial({
			map: floorTexture,
			roughness: 0.8,
			metalness: 0.05
		});

		const baseGeometry = new THREE.BoxGeometry(600, 6, 600);
		const baseMaterial = new THREE.MeshStandardMaterial({
			color: 0x1f2b23,
			roughness: 1
		});
		const baseGround = new THREE.Mesh(baseGeometry, baseMaterial);
		baseGround.position.y = -3;
		baseGround.receiveShadow = true;
		scene.add(baseGround);

		const terrainGeometry = new THREE.PlaneGeometry(600, 600, 120, 120);
		terrainGeometry.rotateX(-Math.PI / 2);
		const terrainVertices = terrainGeometry.attributes.position.array;
		for (let i = 0; i < terrainVertices.length; i += 3) {
			const x = terrainVertices[i];
			const z = terrainVertices[i + 2];
			const dist = Math.sqrt(x * x + z * z);
			let h = Math.sin(x / 18) * Math.cos(z / 22) * 3;
			h += Math.sin(x / 7) * 0.9;
			h += Math.cos(z / 9) * 0.6;
			if (dist > 80) {
				h += (dist - 80) * 0.15;
			}
			terrainVertices[i + 1] = h;
		}
		terrainGeometry.computeVertexNormals();

		const terrainMaterial = floorMaterial;
		const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
		terrain.receiveShadow = true;
		scene.add(terrain);

		function getTerrainHeightAt(posX, posZ) {
			const dist = Math.sqrt(posX * posX + posZ * posZ);
			let h = Math.sin(posX / 18) * Math.cos(posZ / 22) * 3;
			h += Math.sin(posX / 7) * 0.9;
			h += Math.cos(posZ / 9) * 0.6;
			if (dist > 80) {
				h += (dist - 80) * 0.15;
			}
			return h;
		}


		const playerGroup = new THREE.Group();
		const playerVisual = new THREE.Group();
		playerGroup.add(playerVisual);

		const placeholderMaterial = new THREE.MeshStandardMaterial({ color: 0xff4500 });
		const placeholderBody = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1, 0.4), placeholderMaterial);
		placeholderBody.position.y = 0.5;
		placeholderBody.castShadow = true;
		playerVisual.add(placeholderBody);
		const placeholderHead = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), placeholderMaterial);
		placeholderHead.position.y = 1.15;
		placeholderHead.castShadow = true;
		playerVisual.add(placeholderHead);

		playerGroup.position.set(0, 0, 0);
		scene.add(playerGroup);

		const remotePlayers = new Map();
		let lastMultiplayerBroadcast = 0;

		function createRemotePlayer(name) {
			const remoteGroup = new THREE.Group();
			remoteGroup.userData.playerName = name || "Jugador";
			remoteGroup.userData.modelLoaded = false;
			scene.add(remoteGroup);

			if (hasMTLLoader && hasOBJLoader) {
				const mtlLoader = new THREE.MTLLoader();
				mtlLoader.setPath(pirateBasePath);
				mtlLoader.load("THUG 2 - Pirate.mtl", (materials) => {
					materials.preload();
					const objLoader = new THREE.OBJLoader();
					objLoader.setMaterials(materials);
					objLoader.setPath(pirateBasePath);
					objLoader.load("THUG 2 - Pirate.obj", (obj) => attachRemotePirateModel(obj, remoteGroup), undefined, e => console.error(e));
				}, undefined, (e) => {
					console.error("Fallo MTL de jugador remoto, intentando solo OBJ:", e);
					const objLoader = new THREE.OBJLoader();
					objLoader.setPath(pirateBasePath);
					objLoader.load("THUG 2 - Pirate.obj", (obj) => attachRemotePirateModel(obj, remoteGroup), undefined, err => console.error(err));
				});
			}

			return remoteGroup;
		}

		function attachRemotePirateModel(obj, remoteGroup) {
			obj.traverse((child) => {
				if (child.isMesh) {
					child.castShadow = true;
					child.receiveShadow = true;
					child.frustumCulled = false;
					if (child.material) {
						const mats = Array.isArray(child.material) ? child.material : [child.material];
						mats.forEach(m => {
							m.side = THREE.DoubleSide;
							if (m.color) m.color.setHex(0xffffff);
						});
					}
				}
			});
			obj.rotation.y = Math.PI;
			fitModelToPlayer(obj);
			remoteGroup.clear();
			remoteGroup.add(obj);
			remoteGroup.userData.modelLoaded = true;
		}

		function getPlayerDisplayName(playerId) {
			if (playerId === localPlayerId) {
				return playerNameValue;
			}

			const remote = remotePlayers.get(playerId);
			return remote && remote.userData && remote.userData.playerName
				? remote.userData.playerName
				: "Jugador";
		}

		function upsertRemotePlayer(data) {
			if (!data || !data.playerId || data.playerId === localPlayerId) {
				return;
			}

			let remote = remotePlayers.get(data.playerId);
			if (!remote) {
				remote = createRemotePlayer(data.playerName);
				remotePlayers.set(data.playerId, remote);
			}

			if (data.position) {
				remote.position.set(data.position.x || 0, data.position.y || 0, data.position.z || 0);
			}
			if (typeof data.rotationY === "number") {
				remote.rotation.y = data.rotationY;
			}
		}

		function removeRemotePlayer(playerId) {
			const remote = remotePlayers.get(playerId);
			if (!remote) {
				return;
			}
			scene.remove(remote);
			remotePlayers.delete(playerId);
		}

		function sendMultiplayerState(type) {
			if (!socket) {
				return;
			}

			const state = {
				room: multiplayerRoom,
				playerId: localPlayerId,
				playerName: playerNameValue,
				position: {
					x: playerGroup.position.x,
					y: playerGroup.position.y,
					z: playerGroup.position.z
				},
				rotationY: playerGroup.rotation.y,
				at: Date.now()
			};

			if (type === "join") {
				socket.emit("join-player", state);
				return;
			}
			if (type === "leave") {
				socket.emit("leave-player", state);
				return;
			}
			socket.emit("player-state", state);
		}

		if (socket) {
			socket.on("connect", function () {
				sendMultiplayerState("join");
			});

			socket.on("room-snapshot", function (players) {
				if (Array.isArray(players)) {
					players.forEach(upsertRemotePlayer);
					return;
				}

				if (!players || !Array.isArray(players.players)) {
					return;
				}

				players.players.forEach(upsertRemotePlayer);
				applyRoomTimer(players.timer);
			});

			socket.on("player-joined", function (data) {
				upsertRemotePlayer(data);
			});

			socket.on("player-state", function (data) {
				upsertRemotePlayer(data);
			});

			socket.on("player-left", function (data) {
				if (!data || !data.playerId) {
					return;
				}
				removeRemotePlayer(data.playerId);
			});

			socket.on("game-restarted", function () {
				location.reload();
			});
		}

		window.addEventListener("beforeunload", function () {
			sendMultiplayerState("leave");
			if (socket) {
				socket.close();
			}
		});

		function fitModelToPlayer(modelRoot) {
			const box = new THREE.Box3().setFromObject(modelRoot);
			const size = new THREE.Vector3();
			box.getSize(size);
			if (!isFinite(size.y) || size.y === 0) return;
			const desiredHeight = 3.6;
			const scale = desiredHeight / size.y;
			modelRoot.scale.setScalar(scale);

			const box2 = new THREE.Box3().setFromObject(modelRoot);
			const center = new THREE.Vector3();
			box2.getCenter(center);
			modelRoot.position.x -= center.x;
			modelRoot.position.z -= center.z;
			modelRoot.position.y -= box2.min.y;
		}

		const obstacleCollisionMargin = 0.3;
		const playerHalfExtents = new THREE.Vector3(0.6, 1.4, 0.6);
		const obstacleColliders = [];

		function addObstacleCollider(obj) {
			if (!obj) {
				return;
			}
			obstacleColliders.push(obj);
		}

		function createPlayerBox(position) {
			const min = new THREE.Vector3(
				position.x - playerHalfExtents.x,
				position.y - playerHalfExtents.y,
				position.z - playerHalfExtents.z
			);
			const max = new THREE.Vector3(
				position.x + playerHalfExtents.x,
				position.y + playerHalfExtents.y,
				position.z + playerHalfExtents.z
			);
			return new THREE.Box3(min, max);
		}

		function isObstacleCollision(position) {
			const playerBox = createPlayerBox(position);
			for (let i = 0; i < obstacleColliders.length; i += 1) {
				const obstacle = obstacleColliders[i];
				if (!obstacle || !obstacle.parent) {
					continue;
				}
				const box = new THREE.Box3().setFromObject(obstacle);
				box.expandByScalar(obstacleCollisionMargin);
				if (box.intersectsBox(playerBox)) {
					return true;
				}
			}
			return false;
		}

		// --- ANIMACIONES DEL PIRATA ---
		let pirateMixer = null;
		let pirateActions = {};
		let pirateClips = {};
		let currentPirateAction = null;
		let isPirateJumping = false;
		const clock = new THREE.Clock();

		function attachPirateModel(obj) {
			obj.traverse((child) => {
				if (child.isMesh) {
					child.castShadow = true;
					child.receiveShadow = true;
					child.frustumCulled = false;
					if (child.material) {
						const mats = Array.isArray(child.material) ? child.material : [child.material];
						mats.forEach(m => {
							m.side = THREE.DoubleSide;
							if (m.color) m.color.setHex(0xffffff);
						});
					}
				}
			});
			obj.rotation.y = Math.PI;
			fitModelToPlayer(obj);
			playerVisual.clear();
			playerVisual.add(obj);
			pirateMixer = null;
			pirateActions = {};
			currentPirateAction = null;
		}

		const pirateBasePath = "../../../Models/Pirata/";
		const hasMTLLoader = typeof THREE.MTLLoader === "function";
		const hasOBJLoader = typeof THREE.OBJLoader === "function";
		const hasFBXLoader = typeof THREE.FBXLoader === "function";

		function loadPirateObjFallback() {
			const mtlLoader = new THREE.MTLLoader();
			mtlLoader.setPath(pirateBasePath);
			mtlLoader.load("THUG 2 - Pirate.mtl", (materials) => {
				materials.preload();
				const objLoader = new THREE.OBJLoader();
				objLoader.setMaterials(materials);
				objLoader.setPath(pirateBasePath);
				objLoader.load("THUG 2 - Pirate.obj", attachPirateModel, undefined, err => console.error(err));
			}, undefined, (err) => {
				console.error("Fallo MTL de Jugador, intentando solo OBJ:", err);
				const objLoader = new THREE.OBJLoader();
				objLoader.setPath(pirateBasePath);
				objLoader.load("THUG 2 - Pirate.obj", attachPirateModel, undefined, loadErr => console.error(loadErr));
			});
		}

		function ensurePirateAction(name) {
			if (!pirateMixer || !pirateClips[name]) {
				return null;
			}
			if (!pirateActions[name]) {
				pirateActions[name] = pirateMixer.clipAction(pirateClips[name]);
			}
			return pirateActions[name];
		}

		function getDesiredMoveActionName() {
			if (keys.w && keys.shift && !keys.control) {
				return "run";
			}
			if (keys.w && !keys.shift && !keys.control) {
				return "walk";
			}
			return "idle";
		}

		function setPirateAction(name, fade = 0.15, force = false) {
			if (!pirateMixer) {
				return;
			}
			const action = ensurePirateAction(name);
			if (!action) {
				return;
			}
			if (!force && currentPirateAction === action) {
				return;
			}

			if (currentPirateAction && currentPirateAction !== action) {
				currentPirateAction.fadeOut(fade);
			}

			action.reset();
			action.fadeIn(fade);
			action.play();
			currentPirateAction = action;
		}

		function handlePirateJumpAction() {
			const action = ensurePirateAction("jump");
			if (!action) {
				return;
			}
			isPirateJumping = true;
			action.setLoop(THREE.LoopOnce, 1);
			action.clampWhenFinished = true;
			setPirateAction("jump", 0.05, true);
		}

		function attachPirateFbxModel(obj) {
			let meshCount = 0;
			obj.traverse((child) => {
				if (child.isMesh) {
					meshCount += 1;
					child.castShadow = true;
					child.receiveShadow = true;
					child.frustumCulled = false;
					if (child.material) {
						const mats = Array.isArray(child.material) ? child.material : [child.material];
						mats.forEach(m => {
							m.side = THREE.DoubleSide;
							if (m.color) m.color.setHex(0xffffff);
						});
					}
				}
			});
			if (!meshCount) {
				console.warn("FBX sin mesh visible, usando OBJ del pirata.");
				loadPirateObjFallback();
				return;
			}

			obj.rotation.y = Math.PI;
			fitModelToPlayer(obj);
			playerVisual.clear();
			playerVisual.add(obj);

			pirateMixer = new THREE.AnimationMixer(obj);
			pirateActions = {};
			currentPirateAction = null;

			if (obj.animations && obj.animations.length) {
				pirateClips.idle = obj.animations[0];
			}

			pirateMixer.addEventListener("finished", function (event) {
				if (!event || !event.action) {
					return;
				}
				if (event.action === pirateActions.jump) {
					isPirateJumping = false;
					setPirateAction(getDesiredMoveActionName(), 0.1, true);
				}
			});

			setPirateAction(getDesiredMoveActionName(), 0.1, true);
		}

		function loadPirateAnimationClip(name, fileName) {
			if (!hasFBXLoader) {
				return;
			}
			const loader = new THREE.FBXLoader();
			loader.setPath(pirateBasePath);
			loader.load(fileName, function (fbx) {
				if (fbx && fbx.animations && fbx.animations.length) {
					pirateClips[name] = fbx.animations[0];
					if (pirateMixer && !currentPirateAction) {
						setPirateAction(getDesiredMoveActionName(), 0.1, true);
					}
				} else {
					console.warn("FBX sin animacion:", fileName);
				}
			}, undefined, function (err) {
				console.error("Error cargando animacion FBX:", fileName, err);
			});
		}

		if (!hasMTLLoader || !hasOBJLoader) {
			console.warn("MTLLoader/OBJLoader no disponibles.");
		} else {
			if (hasFBXLoader) {
				const fbxLoader = new THREE.FBXLoader();
				fbxLoader.setPath(pirateBasePath);
				fbxLoader.load("Idle.fbx", attachPirateFbxModel, undefined, (e) => {
					console.error("Fallo FBX de Jugador, usando OBJ:", e);
					loadPirateObjFallback();
				});
			} else {
				loadPirateObjFallback();
			}

			loadPirateAnimationClip("idle", "Idle.fbx");
			loadPirateAnimationClip("walk", "Walking.fbx");
			loadPirateAnimationClip("run", "Running.fbx");
			loadPirateAnimationClip("jump", "Jump.fbx");
		}

		const keys = { w: false, a: false, s: false, d: false, shift: false, control: false, " ": false };
		let moveSpeed = 0.15;
		const baseSpeed = 0.15;
		const runSpeed = 0.3;
		const crouchSpeed = 0.075;
		const rotateSpeed = 0.05;
		let velocityY = 0;
		const gravity = -0.015;
		const jumpForce = 0.3;
		let isGrounded = true;

		let cameraAzimuth = 0;
		let cameraPolar = Math.PI / 4;
		let cameraDistance = 10;

		window.addEventListener("contextmenu", (e) => e.preventDefault());
		window.addEventListener("wheel", (e) => {
			cameraDistance += e.deltaY * 0.01;
			cameraDistance = Math.max(3, Math.min(40, cameraDistance));
		});
		window.addEventListener("mousemove", (e) => {
			cameraAzimuth -= e.movementX * 0.005;
			cameraPolar = Math.max(0.1, Math.min(Math.PI / 2.1, cameraPolar + e.movementY * 0.005));
		});

		window.addEventListener("keydown", (e) => {
			if (isGameOver) {
				return;
			}

			const key = e.key.toLowerCase();
			if (keys.hasOwnProperty(key)) keys[key] = true;
			if (e.shiftKey || e.key === "Shift") keys.shift = true;
			if (e.ctrlKey || e.key === "Control") keys.control = true;
			if (e.key === " ") {
				keys[" "] = true;
				if (isGrounded && !keys.control) {
					velocityY = jumpForce;
					isGrounded = false;
					handlePirateJumpAction();
				}
			}
			if (key === "m") {
				alert("Coordenadas del Pirata:\nX: " + playerGroup.position.x.toFixed(2) + "\nY: " + playerGroup.position.y.toFixed(2) + "\nZ: " + playerGroup.position.z.toFixed(2));
			}
		});
		window.addEventListener("keyup", (e) => {
			const key = e.key.toLowerCase();
			if (keys.hasOwnProperty(key)) keys[key] = false;
			if (e.key === "Shift") keys.shift = false;
			if (e.key === "Control") keys.control = false;
			if (e.key === " ") keys[" "] = false;
		});

		window.addEventListener("resize", () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});

		function animate() {
			requestAnimationFrame(animate);
			if (isGameOver) {
				renderer.render(scene, camera);
				return;
			}

			const delta = clock.getDelta();
			if (pirateMixer) {
				pirateMixer.update(delta);
			}

			const prevPosition = playerGroup.position.clone();

			if (keys.control) moveSpeed = crouchSpeed;
			else if (keys.shift) moveSpeed = runSpeed;
			else moveSpeed = baseSpeed;

			if (keys.w) playerGroup.translateZ(-moveSpeed);
			if (keys.s) playerGroup.translateZ(moveSpeed);
			if (keys.a) playerGroup.rotation.y += rotateSpeed;
			if (keys.d) playerGroup.rotation.y -= rotateSpeed;

			if (!isPirateJumping) {
				setPirateAction(getDesiredMoveActionName(), 0.12);
			}

			const walkCycle = Date.now() * (keys.shift && !keys.control ? 0.02 : 0.01);
			if (keys.control) {
				playerGroup.scale.set(1.0, 0.6, 1.0);
				playerVisual.position.y = 0;
			} else {
				playerGroup.scale.set(1.0, 1.0, 1.0);
				if (keys.w || keys.s || keys.a || keys.d) playerVisual.position.y = Math.abs(Math.sin(walkCycle)) * 0.1;
				else playerVisual.position.y = 0;
			}

			const floorLevel = Math.max(0, getTerrainHeightAt(playerGroup.position.x, playerGroup.position.z));
			velocityY += gravity;
			playerGroup.position.y += velocityY;

			if (playerGroup.position.y <= floorLevel) {
				playerGroup.position.y = floorLevel;
				velocityY = 0;
				isGrounded = true;
			}

			if (isObstacleCollision(playerGroup.position)) {
				playerGroup.position.x = prevPosition.x;
				playerGroup.position.z = prevPosition.z;
			}

			const angle = playerGroup.rotation.y + cameraAzimuth;
			const x = Math.sin(angle) * Math.cos(cameraPolar) * cameraDistance;
			const y = Math.sin(cameraPolar) * cameraDistance;
			const z = Math.cos(angle) * Math.cos(cameraPolar) * cameraDistance;

			camera.position.set(playerGroup.position.x + x, playerGroup.position.y + y, playerGroup.position.z + z);
			camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

			const now = performance.now();
			if (now - lastMultiplayerBroadcast > 90) {
				sendMultiplayerState("state");
				lastMultiplayerBroadcast = now;
			}

			renderer.render(scene, camera);
		}
		animate();

		chatForm.addEventListener("submit", function (event) {
			event.preventDefault();
			const message = chatInput.value.trim();
			if (!message) {
				return;
			}

			addPlayerMessage(message);
			chatInput.value = "";
		});

		reactionItems.forEach(function (reactionButton) {
			reactionButton.addEventListener("click", function () {
				const reactionText = reactionButton.textContent.trim();
				if (!reactionText) {
					return;
				}

				addPlayerMessage(reactionText);
				playReactionSound();
				reactionsPopup.classList.remove("is-open");
				chatPopup.classList.add("is-open");
			});
		});
	</script>
</body>
</html>
