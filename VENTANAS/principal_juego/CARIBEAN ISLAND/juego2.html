<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caribean Island - Juego 2</title>
    <link rel="stylesheet" href="caribean_island_styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <canvas id="gameCanvas"></canvas>
    <div class="game-hud">
        <div class="settings-profile-row">
            <div class="game-settings-card" aria-live="polite">
                <div><strong>Dificultad:</strong> <span id="currentDifficulty">Normal</span></div>
                <div><strong>Música:</strong> <span id="currentMusic">70</span></div>
                <div><strong>Efectos:</strong> <span id="currentSfx">75</span></div>
                <div><strong>Pantalla completa:</strong> <span id="currentFullscreen">No</span></div>
            </div>
            <button class="profile-photo-button" type="button" aria-label="Perfil del jugador">
                <img src="img/foto perfil muestra.webp" alt="Foto de perfil del jugador">
            </button>
        </div>

        <header class="hud-top">
            <div class="hud-group">
                <button class="game-button game-button-image" id="inventoryButton" type="button">Inventario</button>
                <button class="game-button game-button-image" type="button">Mapa</button>
            </div>
            <div class="hud-group">
                <button class="game-button game-button-pause" id="pauseButton" type="button"
                    aria-label="Pausa"></button>
            </div>
        </header>

        <div class="game-stats-card" aria-live="polite">
            <div class="stats-text-row"><strong>Cronómetro:</strong> <span id="gameTimer">00:00</span></div>
            <div class="stats-text-row"><strong>Nombre:</strong> <span id="currentPlayerName">Jugador</span></div>
            <div class="stats-coins-wrap">
                <img class="stats-coins-label" src="img/NUM MONEDAS.png" alt="Monedas">
                <span class="stats-coins-count" id="coinCount">0</span>
            </div>
            <div class="stats-text-row"><strong>Vida:</strong> <span id="lifeCount">100</span></div>
        </div>

        <div class="steal-toast" id="stealToast" aria-live="polite"></div>

        <footer class="hud-bottom">
            <div class="movement-controls">
                <img class="wasd-hint" src="img/wasd.png" alt="Controles WASD">
                <div class="hud-group">
                    <button class="game-button game-button-soft" type="button">Correr</button>
                </div>
            </div>
            <div class="hud-group hud-group-actions">
                <button class="game-button game-button-main game-button-image" id="interactButton"
                    type="button">Interactuar</button>
                <button class="game-button game-button-image" id="reactionsButton" type="button">Reacciones</button>
            </div>
        </footer>

        <section class="chat-popup" id="chatPopup" aria-live="polite" aria-label="Chat rápido">
            <div class="chat-popup-header">
                <span>Chat</span>
                <button class="chat-close" id="closeChatButton" type="button" aria-label="Cerrar chat">×</button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message npc">Jugador2: Acá hay mas monedassss</div>
            </div>
            <form class="chat-input-row" id="chatForm">
                <input id="chatInput" type="text" maxlength="120" placeholder="Escribe..." autocomplete="off">
                <button class="chat-send" type="submit">Enviar</button>
            </form>
        </section>

        <section class="reactions-popup" id="reactionsPopup" aria-label="Inventario de reacciones">
            <div class="reactions-popup-header">
                <span>Reacciones</span>
                <button class="reactions-close" id="closeReactionsButton" type="button"
                    aria-label="Cerrar reacciones">×</button>
            </div>
            <div class="reactions-grid">
                <button class="reaction-item" type="button">Silbar</button>
                <button class="reaction-item" type="button">Saludar</button>
                <button class="reaction-item" type="button">Señalar</button>
                <button class="reaction-item" type="button">Distraer</button>
                <button class="reaction-item" type="button">Burlarse</button>
                <button class="reaction-item" type="button">Callar</button>
            </div>
        </section>

        <section class="inventory-popup" id="inventoryPopup" aria-label="Inventario del jugador">
            <div class="inventory-popup-header">
                <span>Inventario</span>
                <button class="inventory-close" id="closeInventoryButton" type="button"
                    aria-label="Cerrar inventario">×</button>
            </div>
            <div class="inventory-grid">
                <button class="inventory-slot" type="button">🗝️</button>
                <button class="inventory-slot" type="button">💰</button>
                <button class="inventory-slot" type="button">📜</button>
                <button class="inventory-slot" type="button"></button>
                <button class="inventory-slot" type="button"></button>
                <button class="inventory-slot" type="button"></button>
                <button class="inventory-slot" type="button"></button>
                <button class="inventory-slot" type="button"></button>
                <button class="inventory-slot" type="button"></button>
            </div>
        </section>

        <section class="pause-modal" id="pauseModal" aria-label="Menú de pausa">
            <div class="pause-menu-panel">
                <button id="closePauseMenuCrossButton" class="close-modal-button" type="button"
                    aria-label="Cerrar"></button>
                <img class="pause-modal-image" src="img/MENU-PAUSA.png" alt="Menú de pausa">
                <div class="pause-menu-actions">
                    <button class="pause-menu-btn" id="pauseResumeButton" type="button">Reanudar</button>
                    <button class="pause-menu-btn" id="pauseRestartButton" type="button">Reiniciar</button>
                    <button class="pause-menu-btn" id="pauseOptionsButton" type="button">Opciones</button>
                    <button class="pause-menu-btn" id="pauseExitButton" type="button">Salir</button>
                </div>
            </div>
        </section>

        <section class="game-over-modal" id="gameOverModal" aria-label="Juego terminado">
            <div class="game-over-panel">
                <h2 id="gameOverTitle">Juego terminado</h2>
                <p id="gameOverMessage">Tiempo agotado</p>
                <p id="gameOverScores"></p>
                <div class="game-over-actions">
                    <button class="pause-menu-btn" id="gameOverRestartButton" type="button">Reiniciar</button>
                    <button class="pause-menu-btn" id="gameOverExitButton" type="button">Salir</button>
                </div>
            </div>
        </section>

        <div id="pauseOptionsModal" class="options-modal" aria-hidden="true">
            <div class="options-panel" role="dialog" aria-modal="true" aria-labelledby="pauseOptionsTitle">
                <img class="options-panel-image" src="../../menu_inicial/img/MENU-OPTIONS.png" alt="Panel de opciones">
                <div class="options-panel-content">
                    <button id="closePauseOptionsButton" class="close-modal-button" type="button"
                        aria-label="Cerrar"></button>
                    <div class="options-header">
                        <img id="pauseOptionsTitle" class="options-title-image" src="../../menu_inicial/img/options.png"
                            alt="Opciones">
                    </div>

                    <div class="options-content">
                        <label class="option-row">
                            <span>Música</span>
                            <input id="pauseMusicRange" type="range" min="0" max="100" value="70">
                        </label>

                        <label class="option-row">
                            <span>Efectos de sonido</span>
                            <input id="pauseSfxRange" type="range" min="0" max="100" value="75">
                        </label>

                        <label class="option-row">
                            <span>Dificultad</span>
                            <select id="pauseDifficultySelect">
                                <option>Fácil</option>
                                <option selected>Normal</option>
                                <option>Difícil</option>
                            </select>
                        </label>

                        <label class="option-row option-check">
                            <span>Pantalla completa</span>
                            <input id="pauseFullscreenCheck" type="checkbox">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameParams = new URLSearchParams(window.location.search);
        const currentPlayerName = document.getElementById("currentPlayerName");
        const currentDifficulty = document.getElementById("currentDifficulty");
        const currentMusic = document.getElementById("currentMusic");
        const currentSfx = document.getElementById("currentSfx");
        const currentFullscreen = document.getElementById("currentFullscreen");
        const gameTimer = document.getElementById("gameTimer");
        const pauseButton = document.getElementById("pauseButton");
        const coinCount = document.getElementById("coinCount");
        const stealToast = document.getElementById("stealToast");
        const inventoryButton = document.getElementById("inventoryButton");
        const interactButton = document.getElementById("interactButton");
        const reactionsButton = document.getElementById("reactionsButton");
        const chatPopup = document.getElementById("chatPopup");
        const reactionsPopup = document.getElementById("reactionsPopup");
        const inventoryPopup = document.getElementById("inventoryPopup");
        const pauseModal = document.getElementById("pauseModal");
        const gameOverModal = document.getElementById("gameOverModal");
        const gameOverTitle = document.getElementById("gameOverTitle");
        const gameOverMessage = document.getElementById("gameOverMessage");
        const gameOverScores = document.getElementById("gameOverScores");
        const gameOverRestartButton = document.getElementById("gameOverRestartButton");
        const gameOverExitButton = document.getElementById("gameOverExitButton");
        const pauseResumeButton = document.getElementById("pauseResumeButton");
        const pauseRestartButton = document.getElementById("pauseRestartButton");
        const pauseOptionsButton = document.getElementById("pauseOptionsButton");
        const pauseExitButton = document.getElementById("pauseExitButton");
        const closePauseMenuCrossButton = document.getElementById("closePauseMenuCrossButton");
        const pauseOptionsModal = document.getElementById("pauseOptionsModal");
        const closePauseOptionsButton = document.getElementById("closePauseOptionsButton");
        const pauseDifficultySelect = document.getElementById("pauseDifficultySelect");
        const pauseMusicRange = document.getElementById("pauseMusicRange");
        const pauseSfxRange = document.getElementById("pauseSfxRange");
        const pauseFullscreenCheck = document.getElementById("pauseFullscreenCheck");
        const closeChatButton = document.getElementById("closeChatButton");
        const closeReactionsButton = document.getElementById("closeReactionsButton");
        const closeInventoryButton = document.getElementById("closeInventoryButton");
        const chatForm = document.getElementById("chatForm");
        const chatInput = document.getElementById("chatInput");
        const chatMessages = document.getElementById("chatMessages");
        const reactionItems = document.querySelectorAll(".reaction-item");

        const lifeCount = document.getElementById("lifeCount");
        let playerHP = 100;

        let idolHolderId = "";
        let idolCoinTimer = 0;

        const difficultyValue = localStorage.getItem("game_difficulty") || gameParams.get("difficulty") || "Normal";
        const musicValue = localStorage.getItem("game_music") || gameParams.get("music") || "70";
        const sfxValue = localStorage.getItem("game_sfx") || gameParams.get("sfx") || "75";
        const fullscreenValue = (localStorage.getItem("game_fullscreen") !== null ? localStorage.getItem("game_fullscreen") === "1" : gameParams.get("fullscreen") === "1") ? "Sí" : "No";
        const playerNameValue = (gameParams.get("playerName") || localStorage.getItem("playerName") || sessionStorage.getItem("playerName") || "Jugador").trim() || "Jugador";
        let sfxVolume = Math.max(0, Math.min(100, Number(sfxValue) || 0)) / 100;

        // --- Cargar foto de perfil de Facebook si existe ---
        const storedPhoto = localStorage.getItem("playerPhoto");
        if (storedPhoto) {
            const profileBtnImg = document.querySelector(".profile-photo-button img");
            if (profileBtnImg) {
                profileBtnImg.src = storedPhoto;
                profileBtnImg.style.objectFit = "cover";
            }
        }

        // --- Música de fondo ---
        const bgMusic = new Audio("../../../Models1/music1.mp3");
        bgMusic.loop = true;
        bgMusic.volume = Math.max(0, Math.min(100, Number(musicValue) || 0)) / 100;
        bgMusic.play().catch(function () {
            function startBgMusic() {
                bgMusic.play().catch(function () { });
                document.removeEventListener("click", startBgMusic);
                document.removeEventListener("keydown", startBgMusic);
            }
            document.addEventListener("click", startBgMusic, { once: true });
            document.addEventListener("keydown", startBgMusic, { once: true });
        });

        const localPlayerId = sessionStorage.getItem("multiplayerPlayerId") || (
            window.crypto && typeof window.crypto.randomUUID === "function"
                ? window.crypto.randomUUID()
                : String(Date.now()) + Math.random().toString(16).slice(2)
        );
        const multiplayerRoom = localStorage.getItem("multiplayerRoom") || "caribean-island-room";
        const multiplayerServerUrl = localStorage.getItem("multiplayerServerUrl") || window.location.origin;
        const socket = typeof io === "function"
            ? io(multiplayerServerUrl, { transports: ["websocket", "polling"] })
            : null;

        sessionStorage.setItem("multiplayerPlayerId", localPlayerId);
        localStorage.setItem("multiplayerRoom", multiplayerRoom);

        // --- Sonidos de pasos ---
        const walkSoundTierra = new Audio("../../../sounds/Caminar-Tierra.mp3");
        walkSoundTierra.loop = true;
        walkSoundTierra.volume = sfxVolume;

        const walkSoundAgua = new Audio("../../../sounds/Caminar-Agua2.mp3");
        walkSoundAgua.loop = true;
        walkSoundAgua.volume = sfxVolume;

        let currentFootstepSound = null; // cuál está sonando ahora

        function updateFootstepSounds() {
            const isMoving = (keys.w || keys.s) && isGrounded && !isPirateJumping && !isPaused && !isGameOver;
            const isRunning = isMoving && keys.shift && !keys.control;
            const rate = isRunning ? 1.55 : 1.0;

            if (isMoving) {
                // Detectar si el jugador está en agua usando la misma fórmula del terreno
                const px = playerGroup.position.x;
                const pz = playerGroup.position.z;
                const terrH = (Math.sin(px / 15) * Math.cos(pz / 15) * 5) + (Math.sin(px / 5) * 1);
                const pdist = Math.sqrt(px * px + pz * pz);
                const finalH = pdist > 60 ? terrH + (pdist - 60) * 0.4 : terrH;
                const inWater = finalH < 1.0;

                const targetSound = inWater ? walkSoundAgua : walkSoundTierra;
                const otherSound = inWater ? walkSoundTierra : walkSoundAgua;

                // Detener el sonido que no corresponde
                if (!otherSound.paused) {
                    otherSound.pause();
                    otherSound.currentTime = 0;
                }

                // Reproducir el correcto
                targetSound.playbackRate = rate;
                targetSound.volume = sfxVolume;
                if (targetSound.paused) {
                    targetSound.play().catch(function () { });
                }
                currentFootstepSound = targetSound;
            } else {
                // Detener ambos si el jugador no se mueve
                if (!walkSoundTierra.paused) {
                    walkSoundTierra.pause();
                }
                if (!walkSoundAgua.paused) {
                    walkSoundAgua.pause();
                }
                currentFootstepSound = null;
            }
        }

        let uiAudioContext;
        let collectedCoins = 0;

        function addPlayerMessage(message) {
            const playerMessage = document.createElement("div");
            playerMessage.className = "chat-message player";
            playerMessage.textContent = "Tú: " + message;
            chatMessages.appendChild(playerMessage);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMessage(message) {
            const systemMessage = document.createElement("div");
            systemMessage.className = "chat-message npc";
            systemMessage.textContent = message;
            chatMessages.appendChild(systemMessage);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        let stealToastTimer;
        function showStealToast(message) {
            stealToast.textContent = message;
            stealToast.classList.add("is-open");
            clearTimeout(stealToastTimer);
            stealToastTimer = setTimeout(function () {
                stealToast.classList.remove("is-open");
            }, 2200);
        }

        function playReactionSound() {
            if (sfxVolume <= 0) {
                return;
            }

            if (!uiAudioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) {
                    return;
                }
                uiAudioContext = new AudioContextClass();
            }

            const startTime = uiAudioContext.currentTime;
            const oscillator = uiAudioContext.createOscillator();
            const gain = uiAudioContext.createGain();

            oscillator.type = "triangle";
            oscillator.frequency.setValueAtTime(620, startTime);
            oscillator.frequency.exponentialRampToValueAtTime(780, startTime + 0.08);

            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(Math.max(0.01, sfxVolume * 0.18), startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.14);

            oscillator.connect(gain);
            gain.connect(uiAudioContext.destination);

            oscillator.start(startTime);
            oscillator.stop(startTime + 0.14);
        }

        currentDifficulty.textContent = difficultyValue;
        currentMusic.textContent = musicValue;
        currentSfx.textContent = sfxValue;
        currentFullscreen.textContent = fullscreenValue;
        currentPlayerName.textContent = playerNameValue;
        coinCount.textContent = String(collectedCoins);
        document.title = "Caribean Island - " + playerNameValue;

        let isGameOver = false;
        let isPaused = false;
        let pauseStartTime = 0;
        let remainingSeconds = 60;
        let roomTimerStartedAt = Date.now();
        let roomTimerDurationSeconds = 60;
        let roomTimerServerOffset = 0;
        let stealRequestPending = false;
        const coinCountsByPlayer = new Map([[localPlayerId, 0]]);

        function updateGameTimer() {
            const minutes = String(Math.floor(remainingSeconds / 60)).padStart(2, "0");
            const seconds = String(remainingSeconds % 60).padStart(2, "0");
            gameTimer.textContent = minutes + ":" + seconds;
        }

        function updateCoinCounts(coinCounts) {
            if (!coinCounts || typeof coinCounts !== "object") {
                return;
            }

            Object.entries(coinCounts).forEach(function ([playerId, count]) {
                coinCountsByPlayer.set(playerId, Number(count) || 0);
            });
            collectedCoins = coinCountsByPlayer.get(localPlayerId) || 0;
            coinCount.textContent = String(collectedCoins);
        }

        function getPlayerDisplayName(playerId) {
            if (playerId === localPlayerId) {
                return playerNameValue;
            }

            const remote = remotePlayers.get(playerId);
            return remote && remote.userData && remote.userData.playerName
                ? remote.userData.playerName
                : "Jugador";
        }

        function isHardDifficulty() {
            return currentDifficulty.textContent.toLowerCase().includes("dif");
        }

        function isEasyDifficulty() {
            return currentDifficulty.textContent.toLowerCase().includes("fá") || currentDifficulty.textContent.toLowerCase().includes("fa");
        }

        function finishGame(reason) {
            if (isGameOver) {
                return;
            }

            isGameOver = true;
            const myCoins = coinCountsByPlayer.get(localPlayerId) || collectedCoins;
            coinCountsByPlayer.set(localPlayerId, myCoins);
            const scores = Array.from(coinCountsByPlayer.entries());
            const lowestCoins = Math.min(...scores.map(([, count]) => count));
            const highestCoins = Math.max(...scores.map(([, count]) => count));

            if (reason === "drowned") {
                gameOverTitle.textContent = "¡Has Naufragado!";
                gameOverMessage.textContent = "Te quedaste sin vida en el mar. Recolectaste " + myCoins + " monedas.";
            } else if (reason === "defeated") {
                gameOverTitle.textContent = "¡Derrotado!";
                gameOverMessage.textContent = "Fuiste eliminado por tus rivales en combate. Recolectaste " + myCoins + " monedas.";
            } else if (reason === "cursed") {
                gameOverTitle.textContent = "¡Maldición Dorada!";
                gameOverMessage.textContent = "Sucumbiste a la maldición del Botín Sagrado. Recolectaste " + myCoins + " monedas.";
            } else if (highestCoins === lowestCoins) {
                gameOverTitle.textContent = "Empate";
                gameOverMessage.textContent = "Nadie pierde: ambos juntaron " + myCoins + " monedas.";
            } else if (myCoins === lowestCoins) {
                gameOverTitle.textContent = "Perdiste";
                gameOverMessage.textContent = "Te quedaste con menos monedas.";
            } else {
                gameOverTitle.textContent = "Ganaste";
                gameOverMessage.textContent = "Tu rival juntó menos monedas.";
            }

            gameOverScores.textContent = scores
                .map(function ([playerId, count]) {
                    return getPlayerDisplayName(playerId) + ": " + count;
                })
                .join(" | ");

            chatPopup.classList.remove("is-open");
            reactionsPopup.classList.remove("is-open");
            inventoryPopup.classList.remove("is-open");
            pauseModal.classList.remove("is-open");
            pauseOptionsModal.classList.remove("is-open");
            bgMusic.pause();
            bgMusic.currentTime = 0;
            gameOverModal.classList.add("is-open");
        }

        function applyRoomTimer(timer) {
            if (!timer || typeof timer.startedAt !== "number" || typeof timer.durationSeconds !== "number") {
                return;
            }

            roomTimerStartedAt = timer.startedAt;
            roomTimerDurationSeconds = timer.durationSeconds;
            roomTimerServerOffset = (typeof timer.serverNow === "number" ? timer.serverNow : Date.now()) - Date.now();
            updateSharedTimer();
        }

        function updateSharedTimer() {
            if (isPaused || isGameOver) {
                return;
            }

            const estimatedServerNow = Date.now() + roomTimerServerOffset;
            const elapsedSeconds = Math.floor((estimatedServerNow - roomTimerStartedAt) / 1000);
            remainingSeconds = Math.max(0, roomTimerDurationSeconds - elapsedSeconds);
            updateGameTimer();

            if (remainingSeconds === 0) {
                finishGame();
            }
        }

        updateSharedTimer();
        setInterval(function () {
            if (!isGameOver) {
                updateSharedTimer();
            }
        }, 1000);

        interactButton.addEventListener("click", function () {
            inventoryPopup.classList.remove("is-open");
            reactionsPopup.classList.remove("is-open");
            chatPopup.classList.add("is-open");
            chatInput.focus();
        });

        reactionsButton.addEventListener("click", function () {
            inventoryPopup.classList.remove("is-open");
            chatPopup.classList.remove("is-open");
            reactionsPopup.classList.add("is-open");
        });

        inventoryButton.addEventListener("click", function () {
            pauseModal.classList.remove("is-open");
            chatPopup.classList.remove("is-open");
            reactionsPopup.classList.remove("is-open");
            inventoryPopup.classList.add("is-open");
        });

        pauseButton.addEventListener("click", function () {
            pauseOptionsModal.classList.remove("is-open");
            chatPopup.classList.remove("is-open");
            reactionsPopup.classList.remove("is-open");
            inventoryPopup.classList.remove("is-open");
            pauseModal.classList.add("is-open");
            if (!isPaused) {
                isPaused = true;
                pauseStartTime = Date.now();
                bgMusic.pause();
            }
        });

        pauseModal.addEventListener("click", function (event) {
            if (event.target === pauseModal) {
                pauseModal.classList.remove("is-open");
            }
        });

        function resumeGameFromPause() {
            pauseModal.classList.remove("is-open");
            if (isPaused) {
                isPaused = false;
                bgMusic.play().catch(function () { });
                if (pauseStartTime > 0) {
                    roomTimerStartedAt += (Date.now() - pauseStartTime);
                    pauseStartTime = 0;
                }
            }
        }

        pauseResumeButton.addEventListener("click", resumeGameFromPause);
        closePauseMenuCrossButton.addEventListener("click", resumeGameFromPause);

        pauseRestartButton.addEventListener("click", function () {
            location.reload();
        });

        pauseOptionsButton.addEventListener("click", function () {
            pauseModal.classList.remove("is-open");
            pauseOptionsModal.setAttribute("aria-hidden", "false");
            pauseDifficultySelect.value = currentDifficulty.textContent;
            pauseMusicRange.value = currentMusic.textContent;
            pauseSfxRange.value = currentSfx.textContent;
            pauseFullscreenCheck.checked = currentFullscreen.textContent === "Sí";
            pauseOptionsModal.classList.add("is-open");
        });

        function closePauseOptionsModal() {
            pauseOptionsModal.classList.remove("is-open");
            pauseOptionsModal.setAttribute("aria-hidden", "true");
            pauseModal.classList.add("is-open");
        }

        pauseOptionsModal.addEventListener("click", function (event) {
            if (event.target === pauseOptionsModal) {
                closePauseOptionsModal();
            }
        });

        closePauseOptionsButton.addEventListener("click", function () {

                        if (child.isMesh) {
                            meshCount += 1;
                            child.castShadow = true;

                            child.frustumCulled = false;
                            if (child.material) {
                                const mats = Array.isArray(child.material) ? child.material : [child.material];

                                    m.side = THREE.DoubleSide;

                            }

                    });

                    if (!meshCount) {
                        console.warn("Remote FBX sin mesh, usando OBJ.");
                        loadRemotePirateObjFallback(remoteGroup);
                        return;

                    obj.rotation.y = Math.PI;
                    fitModelToPlayer(obj);

                    child.receiveShadow = true;

                    if (child.material) {

                        mats.forEach(m => {
                            m.side = THREE.DoubleSide;

        function setRemotePlayerAction(remoteGroup, name, fade = 0.15) {
            const mixer = remoteGroup.userData.mixer;
            if (!mixer || !pirateClips[name]) {
                return;
            }
            const actions = remoteGroup.userData.actions;
            if (!actions[name]) {
                actions[name] = mixer.clipAction(pirateClips[name]);
            }
            const action = actions[name];
            if (remoteGroup.userData.currentAction === action) {
                return;
            }
            if (remoteGroup.userData.currentAction) {
                remoteGroup.userData.currentAction.fadeOut(fade);
            }
            action.reset();
            action.fadeIn(fade);
            action.play();
            remoteGroup.userData.currentAction = action;
        }

            const coinId = coin.userData.coinId;

                return;

            collectedCoinIds.add(coinId);
            scene.remove(coin);

            if (window.escenarioPirata && Array.isArray(window.escenarioPirata.monedas)) {
                const index = window.escenarioPirata.monedas.indexOf(coin);
                if (index >= 0) {
                    window.escenarioPirata.monedas.splice(index, 1);
                }
            }

            collectedCoins += 1;
            coinCount.textContent = String(collectedCoins);
            coinCountsByPlayer.set(localPlayerId, collectedCoins);

            if (socket) {
                socket.emit("coin-collected", {
                    room: multiplayerRoom,
                    playerId: localPlayerId,
                    coinId
                });

            if (!window.escenarioPirata || !Array.isArray(window.escenarioPirata.monedas)) {

            const coins = window.escenarioPirata.monedas.slice();
            coins.forEach((coin) => {
                if (!coin || !coin.userData || !coin.userData.coinId) {
                    return;

                if (collectedCoinIds.has(coin.userData.coinId)) {
                    return;

                const distance = playerGroup.position.distanceTo(coin.position);
                if (distance <= 2.2) {
                    collectCoin(coin);

            });

        function getNearbyStealTarget() {
            let nearestTargetId = "";

            remotePlayers.forEach(function (remote, playerId) {
                const remoteCoins = coinCountsByPlayer.get(playerId) || 0;
                if (remoteCoins <= 0) {
                    return;
                }

                const distance = playerGroup.position.distanceTo(remote.position);
                if (distance <= 4 && distance < nearestDistance) {
                    nearestDistance = distance;
                    nearestTargetId = playerId;

            return nearestTargetId;

        function upsertRemotePlayer(data) {
            if (!data || !data.playerId || data.playerId === localPlayerId) {
                return;
            }

            let remote = remotePlayers.get(data.playerId);
            if (!remote) {
                remote = createRemotePlayer(data.playerName);
                remotePlayers.set(data.playerId, remote);
            }

            if (data.position) {
                const prevX = remote.position.x;
                const prevZ = remote.position.z;

                remote.position.set(data.position.x || 0, data.position.y || 0, data.position.z || 0);

                const dx = remote.position.x - prevX;
                const dz = remote.position.z - prevZ;
                const distMoved = Math.sqrt(dx * dx + dz * dz);

                remote.userData.lastMoveTime = Date.now();

                if (remote.userData.modelLoaded && remote.userData.mixer) {
                    if (distMoved > 0.20) {
                        setRemotePlayerAction(remote, "run");
                    } else if (distMoved > 0.03) {
                        setRemotePlayerAction(remote, "walk");
                    }
                }
            }
            if (typeof data.rotationY === "number") {
                remote.rotation.y = data.rotationY;
            }
        }

        function fitModelToPlayer(modelRoot) {
            const box = new THREE.Box3().setFromObject(modelRoot);
            const size = new THREE.Vector3();
            box.getSize(size);
            if (!isFinite(size.y) || size.y === 0) return;
            const desiredHeight = 3.6; // Lo he hecho el doble de grande (antes 1.8)
            const scale = desiredHeight / size.y;
            modelRoot.scale.setScalar(scale);

            const box2 = new THREE.Box3().setFromObject(modelRoot);
            const center = new THREE.Vector3();
            box2.getCenter(center);
            modelRoot.position.x -= center.x;
            modelRoot.position.z -= center.z;
            modelRoot.position.y -= box2.min.y;
        }

        const obstacleCollisionMargin = 0.3;
        const playerHalfExtents = new THREE.Vector3(0.6, 1.4, 0.6);
        const obstacleColliders = [];

        function addObstacleCollider(obj) {
            if (!obj) {
                return;
            }
            obstacleColliders.push(obj);
        }

        function createPlayerBox(position) {
            const min = new THREE.Vector3(
                position.x - playerHalfExtents.x,
                position.y - playerHalfExtents.y,
                position.z - playerHalfExtents.z
            );
            const max = new THREE.Vector3(
                position.x + playerHalfExtents.x,
                position.y + playerHalfExtents.y,
                position.z + playerHalfExtents.z
            );
            return new THREE.Box3(min, max);
        }

        function isObstacleCollision(position) {
            const playerBox = createPlayerBox(position);
            for (let i = 0; i < obstacleColliders.length; i += 1) {
                const obstacle = obstacleColliders[i];
                if (!obstacle || !obstacle.parent) {
                    continue;
                }
                const box = new THREE.Box3().setFromObject(obstacle);
                box.expandByScalar(obstacleCollisionMargin);
                if (box.intersectsBox(playerBox)) {
                    return true;
                }
            }
            return false;
        }

            }, undefined, (err) => {
                console.error("Fallo MTL de Jugador, intentando solo OBJ:", err);
                const objLoader = new THREE.OBJLoader();
                objLoader.setPath(pirateBasePath);
                objLoader.load("THUG 2 - Pirate.obj", attachPirateModel, undefined, loadErr => console.error(loadErr));
            });
        }

        function ensurePirateAction(name) {
            if (!pirateMixer || !pirateClips[name]) {
                return null;
            }
            if (!pirateActions[name]) {
                pirateActions[name] = pirateMixer.clipAction(pirateClips[name]);
            }
            return pirateActions[name];
        }

        function getDesiredMoveActionName() {
            if (keys.w && keys.shift && !keys.control) {
                return "run";
            }
            if (keys.w && !keys.shift && !keys.control) {
                return "walk";
            }
            return "idle";
        }

        function setPirateAction(name, fade = 0.15, force = false) {
            if (!pirateMixer) {
                return;
            }
            const action = ensurePirateAction(name);
            if (!action) {
                return;
            }
            if (!force && currentPirateAction === action) {
                return;
            }

            if (currentPirateAction && currentPirateAction !== action) {
                currentPirateAction.fadeOut(fade);
            }

            action.reset();
            action.fadeIn(fade);
            action.play();
            currentPirateAction = action;
        }

        function handlePirateJumpAction() {
            const action = ensurePirateAction("jump");
            if (!action) {
                return;
            }
            isPirateJumping = true;
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            setPirateAction("jump", 0.05, true);
        }

        function attachPirateFbxModel(obj) {
            let meshCount = 0;
            obj.traverse((child) => {
                if (child.isMesh) {
                    meshCount += 1;
                    child.castShadow = true;
                    child.receiveShadow = true;
                    child.frustumCulled = false;
                    if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(m => {
                            m.side = THREE.DoubleSide;
                            if (m.color) m.color.setHex(0xffffff);
                        });
                    }
                }
            });
            if (!meshCount) {
                console.warn("FBX sin mesh visible, usando OBJ del pirata.");
                loadPirateObjFallback();
                return;
            }

            obj.rotation.y = Math.PI;
            fitModelToPlayer(obj);
            playerVisual.clear();
            playerVisual.add(obj);

            pirateMixer = new THREE.AnimationMixer(obj);
            pirateActions = {};
            currentPirateAction = null;

            if (obj.animations && obj.animations.length) {
                pirateClips.idle = obj.animations[0];
            }

            pirateMixer.addEventListener("finished", function (event) {
                if (!event || !event.action) {
                    return;
                }
                if (event.action === pirateActions.jump) {
                    isPirateJumping = false;
                    setPirateAction(getDesiredMoveActionName(), 0.1, true);
                }
            });

            setPirateAction(getDesiredMoveActionName(), 0.1, true);
        }

        function loadPirateAnimationClip(name, fileName) {

            const loader = new THREE.FBXLoader();
            loader.setPath(pirateBasePath);
            loader.load(fileName, function (fbx) {
                if (fbx && fbx.animations && fbx.animations.length) {
                    pirateClips[name] = fbx.animations[0];
                    if (pirateMixer && !currentPirateAction) {
                        setPirateAction(getDesiredMoveActionName(), 0.1, true);
                    }
                } else {
                    console.warn("FBX sin animacion:", fileName);
                }
            }, undefined, function (err) {
                console.error("Error cargando animacion FBX:", fileName, err);
            });
        }

        if (!hasMTLLoader || !hasOBJLoader) {
            console.warn("MTLLoader/OBJLoader no disponibles.");
        } else {
            // CARGAR JUGADOR PIRATA (FBX con idle si existe, OBJ como respaldo)

            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.425, -11.55, 3.08, -65.67, Math.PI / 4); // Esparcido muy a la derecha
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.675, -45.5, 2.9, -49.5, Math.PI / 3); // Esparcido muy a la izquierda
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.55, -15.15, 6.45, -85.91, 1.2); // Más profundo hacia el fondo del mapa

            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.675, 20.01, 2.26, -13.51, Math.random() * Math.PI);
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.425, 26.44, 2.21, -13.50, Math.random() * Math.PI);
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.5, 31.87, 3.35, -10.45, Math.random() * Math.PI);
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.6, 29.47, 4.00, -4.79, Math.random() * Math.PI);
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.6, 10.84, 2.71, 14.48, Math.random() * Math.PI);

            cargarProp("Cofre1", "GoldTrunk.mtl", "GoldTrunk.obj", 2.0, 21.09, 4.03, -1.39, Math.PI / 7); // Junto al bote

            // Caja de colisión invisible personalizada según coordenadas

            const centerZ2 = (5.37 + (-16.99)) / 2;

            const customGeo2 = new THREE.BoxGeometry(widthX2, 20, depthZ2);
            const customMat2 = new THREE.MeshBasicMaterial({ visible: false });
            const customCol2 = new THREE.Mesh(customGeo2, customMat2);
            customCol2.position.set(centerX2, 10, centerZ2);
            scene.add(customCol2);
            addObstacleCollider(customCol2);

            // Tercera caja de colisión invisible personalizada
            // X: 4.33 a 21.47
            // Z: -30.21 a -19.00
            const widthX3 = Math.abs(21.47 - 4.33);
            const depthZ3 = Math.abs(-19.00 - (-30.21));
            const centerX3 = (21.47 + 4.33) / 2;
            const centerZ3 = (-19.00 + -30.21) / 2;

            const customGeo3 = new THREE.BoxGeometry(widthX3, 20, depthZ3);
            const customMat3 = new THREE.MeshBasicMaterial({ visible: false });
            const customCol3 = new THREE.Mesh(customGeo3, customMat3);
            customCol3.position.set(centerX3, 10, centerZ3);
            scene.add(customCol3);
            addObstacleCollider(customCol3);

            // Cuarta caja de colisión invisible personalizada
            // X: -2.52 a 14.12
            // Z: 35.25 a 52.10
            const widthX4 = Math.abs(14.12 - (-2.52));
            const depthZ4 = Math.abs(52.10 - 35.25);
            const centerX4 = (14.12 + (-2.52)) / 2;
            const centerZ4 = (52.10 + 35.25) / 2;

            const customGeo4 = new THREE.BoxGeometry(widthX4, 20, depthZ4);
            const customMat4 = new THREE.MeshBasicMaterial({ visible: false });

            customCol4.position.set(centerX4, 10, centerZ4);
            scene.add(customCol4);
            addObstacleCollider(customCol4);
        };

        const keys = { w: false, a: false, s: false, d: false, shift: false, control: false, " ": false };
        let moveSpeed = 0.15;
        const baseSpeed = 0.15;
        const runSpeed = 0.3;
        const crouchSpeed = 0.075;
        const rotateSpeed = 0.05;
        let velocityY = 0;
        const gravity = -0.015;
        const jumpForce = 0.3;
        let isGrounded = true;

        let isRightMouseDown = false;
        let cameraAzimuth = 0;
        let cameraPolar = Math.PI / 4;
        let cameraDistance = 10;

        window.addEventListener('mousedown', (e) => { if (e.button === 2) isRightMouseDown = true; });
        window.addEventListener('mouseup', (e) => { if (e.button === 2) isRightMouseDown = false; });
        window.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('wheel', (e) => {
            cameraDistance += e.deltaY * 0.01;
            cameraDistance = Math.max(3, Math.min(40, cameraDistance)); // Limitar zoom in (3) y zoom out (40)
        });
        window.addEventListener('mousemove', (e) => {
            if (isRightMouseDown) {
                cameraAzimuth -= e.movementX * 0.005;
                cameraPolar = Math.max(0.1, Math.min(Math.PI / 2.1, cameraPolar + e.movementY * 0.005));
            }
        });

        window.addEventListener('keydown', (e) => {
            if (isGameOver) {
                return;
            }

            if (e.key === "Escape" || e.key === "Esc") {
                if (pauseOptionsModal.classList.contains("is-open")) {
                    closePauseOptionsButton.click();
                } else if (chatPopup.classList.contains("is-open")) {
                    closeChatButton.click();
                } else if (reactionsPopup.classList.contains("is-open")) {
                    closeReactionsButton.click();
                } else if (inventoryPopup.classList.contains("is-open")) {
                    closeInventoryButton.click();
                } else if (pauseModal.classList.contains("is-open")) {
                    pauseResumeButton.click();
                } else {
                    pauseButton.click();
                }
                return;
            }

            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
            if (e.shiftKey || e.key === "Shift") keys.shift = true;
            if (e.key === " ") {
                keys[" "] = true;
                if (isGrounded && !keys.control) {
                    velocityY = jumpForce;
                    isGrounded = false;
                    handlePirateJumpAction();
                }
            }
            if (key === 'p' && !e.repeat) {
                tryStealCoin();
            }
            if (key === 'm') {
                alert(`Coordenadas del Pirata:\nX: ${playerGroup.position.x.toFixed(2)}\nY: ${playerGroup.position.y.toFixed(2)}\nZ: ${playerGroup.position.z.toFixed(2)}`);
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
            if (e.key === "Shift") keys.shift = false;
            if (e.key === "Control") keys.control = false;
            if (e.key === " ") keys[" "] = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver || isPaused) {
                renderer.render(scene, camera);
                return;
            }

            const delta = clock.getDelta();
            if (pirateMixer) {
                pirateMixer.update(delta);
            }

            // Animar los jugadores remotos y resetear a idle si no se mueven
            remotePlayers.forEach(function (remote) {
                if (remote.userData.modelLoaded && remote.userData.mixer) {
                    remote.userData.mixer.update(delta);
                    if (Date.now() - (remote.userData.lastMoveTime || 0) > 200) {
                        setRemotePlayerAction(remote, "idle");
                    }
                }
            });

            const prevPosition = playerGroup.position.clone();

            // --- CÁLCULO DE AGUA Y POSICIONES ---
            const px = playerGroup.position.x;
            const pz = playerGroup.position.z;
            const terrH = (Math.sin(px / 15) * Math.cos(pz / 15) * 5) + (Math.sin(px / 5) * 1);
            const pdist = Math.sqrt(px * px + pz * pz);
            const finalH = pdist > 60 ? terrH + (pdist - 60) * 0.4 : terrH;
            const inWater = finalH < 1.0;

            if (keys.control) moveSpeed = crouchSpeed;
            else if (keys.shift) moveSpeed = runSpeed;
            else moveSpeed = baseSpeed;

            const diffStr = currentDifficulty.textContent.toLowerCase();
            const isEasy = diffStr.includes("fá") || diffStr.includes("fa");
            const isNormal = diffStr.includes("nor");
            const isHard = diffStr.includes("dif");

            let damageRate = 0;

            // --- JUGABILIDAD EXCLUSIVA: EL BOTÍN SAGRADO ---
            if (idolHolderId === localPlayerId) {
                // El portador es ralentizado por la pesadez del tesoro
                if (isNormal) {
                    moveSpeed *= 0.75; // 25% ralentización
                    damageRate += 2;   // Maldición leve de vida (-2 HP/s)
                } else if (isHard) {
                    moveSpeed *= 0.50; // 50% ralentización
                    damageRate += 6;   // Maldición grave de vida (-6 HP/s)
                }
            } else {
                // Los no-portadores sufren daño en el agua en Difícil para obligar el combate central
                if (isHard && inWater) {
                    moveSpeed *= 0.8;
                    damageRate += 5;   // -5 HP por segundo
                }
            }

            if (damageRate > 0) {
                playerHP -= damageRate * delta;
                if (playerHP <= 0) {
                    playerHP = 0;
                    lifeCount.textContent = "0";
                    finishGame(idolHolderId === localPlayerId ? "cursed" : "drowned");
                    renderer.render(scene, camera);
                    return;
                }
                lifeCount.textContent = String(Math.ceil(playerHP));
                lifeCount.style.color = "#ffd700"; // Color dorado reflejando la maldición
                lifeCount.style.fontWeight = "bold";
            } else {
                lifeCount.style.color = "";
                lifeCount.style.fontWeight = "";
            }

            if (keys.w) playerGroup.translateZ(-moveSpeed);
            if (keys.s) playerGroup.translateZ(moveSpeed);
            if (keys.a) playerGroup.rotation.y += rotateSpeed;
            if (keys.d) playerGroup.rotation.y -= rotateSpeed;

            if (!isPirateJumping) {
                setPirateAction(getDesiredMoveActionName(), 0.12);
            }

            const walkCycle = Date.now() * (keys.shift && !keys.control ? 0.02 : 0.01);
            if (keys.control) {
                playerGroup.scale.set(1.0, 0.6, 1.0);
                playerVisual.position.y = 0;
            } else {
                playerGroup.scale.set(1.0, 1.0, 1.0);
                if (keys.w || keys.s || keys.a || keys.d) playerVisual.position.y = Math.abs(Math.sin(walkCycle)) * 0.1;
                else playerVisual.position.y = 0;
            }

            const terrainHeight = (Math.sin(playerGroup.position.x / 15) * Math.cos(playerGroup.position.z / 15) * 5) +
                (Math.sin(playerGroup.position.x / 5) * 1);
            const dist = Math.sqrt(playerGroup.position.x ** 2 + playerGroup.position.z ** 2);
            let finalHeight = terrainHeight;
            if (dist > 60) finalHeight += (dist - 60) * 0.4;

            const floorLevel = Math.max(finalHeight, 1.0);
            velocityY += gravity;
            playerGroup.position.y += velocityY;

            if (playerGroup.position.y <= floorLevel) {
                playerGroup.position.y = floorLevel;
                velocityY = 0;
                isGrounded = true;
            }

            if (isObstacleCollision(playerGroup.position)) {
                playerGroup.position.x = prevPosition.x;
                playerGroup.position.z = prevPosition.z;
            }

            const angle = playerGroup.rotation.y + cameraAzimuth;
            const x = Math.sin(angle) * Math.cos(cameraPolar) * cameraDistance;
            const y = Math.sin(cameraPolar) * cameraDistance;
            const z = Math.cos(angle) * Math.cos(cameraPolar) * cameraDistance;

            camera.position.set(playerGroup.position.x + x, playerGroup.position.y + y, playerGroup.position.z + z);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            if (window.pirateShip) {
                const time = performance.now() * 0.001;
                window.pirateShip.position.y = 0.9 + Math.sin(time) * 0.15;
                window.pirateShip.rotation.x = Math.sin(time * 0.5) * 0.02;
                window.pirateShip.rotation.z = Math.cos(time * 0.5) * 0.02;
            }

            // Animar el escenario pirata
            if (window.escenarioPirata) {
                const time = performance.now() * 0.001;
                window.escenarioPirata.monedas.forEach((moneda, index) => {
                    moneda.rotation.y = time * 2 + index; // Que giren sobre sí mismas
                    moneda.position.y = (moneda.userData.baseY || 1.0) + Math.sin(time * 3 + index) * 0.05; // Que floten brillando un poco
                });
            }

            collectNearbyCoins();

            // Animar la textura del agua y su altura simulando olas
            if (water) {
                const time = performance.now() * 0.001;
                water.position.y = 1.0 + Math.sin(time) * 0.1;
                if (water.material.map) {
                    water.material.map.offset.x -= 0.0002; // Ajuste de velocidad proporcional
                    water.material.map.offset.y += 0.0002;
                }
            }

            // Animar luz del Botín Sagrado (Dorado halo)
            if (idolHolderId === localPlayerId) {
                idolLight.visible = true;
                idolLight.position.copy(playerGroup.position);
                idolLight.position.y += 3;

                // Generación de monedas extra para el portador local cada 2 segundos
                idolCoinTimer += delta;
                if (idolCoinTimer >= 2.0) {
                    idolCoinTimer = 0;
                    if (socket && socket.connected) {
                        socket.emit("coin-collected", {
                            room: multiplayerRoom,
                            playerId: localPlayerId,
                            coinId: "idol-bonus-" + Date.now() + "-" + Math.floor(Math.random() * 1000)
                        });
                    }
                }
            } else if (idolHolderId !== "" && remotePlayers.has(idolHolderId)) {
                const remote = remotePlayers.get(idolHolderId);
                idolLight.visible = true;
                idolLight.position.copy(remote.position);
                idolLight.position.y += 3;
            } else {
                idolLight.visible = false;
            }

            const now = performance.now();
            if (now - lastMultiplayerBroadcast > 90) {
                sendMultiplayerState("state");
                lastMultiplayerBroadcast = now;
            }

            updateFootstepSounds();
            renderer.render(scene, camera);
        }
        animate();

        chatForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const message = chatInput.value.trim();
            if (!message) {
                return;
            }

            addPlayerMessage(message);
            chatInput.value = "";
        });

        reactionItems.forEach(function (reactionButton) {
            reactionButton.addEventListener("click", function () {
                const reactionText = reactionButton.textContent.trim();
                if (!reactionText) {
                    return;
                }

                addPlayerMessage(reactionText);
                playReactionSound();
                reactionsPopup.classList.remove("is-open");
                chatPopup.classList.add("is-open");
            });
        });
    </script>
</body>

</html>
