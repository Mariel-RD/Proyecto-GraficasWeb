<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caribean Island - Juego</title>
    <link rel="stylesheet" href="caribean_island_styles.css">
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="game-hud">
        <div class="settings-profile-row">
            <div class="game-settings-card" aria-live="polite">
                <div><strong>Dificultad:</strong> <span id="currentDifficulty">Normal</span></div>
                <div><strong>Música:</strong> <span id="currentMusic">70</span></div>
                <div><strong>Efectos:</strong> <span id="currentSfx">75</span></div>
                <div><strong>Pantalla completa:</strong> <span id="currentFullscreen">No</span></div>
            </div>
            <button class="profile-photo-button" type="button" aria-label="Perfil del jugador">
                <img src="img/foto perfil muestra.webp" alt="Foto de perfil del jugador">
            </button>
        </div>

        <header class="hud-top">
            <div class="hud-group">
                <button class="game-button game-button-image" id="inventoryButton" type="button">Inventario</button>
                <button class="game-button game-button-image" type="button">Mapa</button>
            </div>
            <div class="hud-group">
                <button class="game-button game-button-pause" id="pauseButton" type="button" aria-label="Pausa"></button>
            </div>
        </header>

        <div class="game-stats-card" aria-live="polite">
            <div class="stats-text-row"><strong>Cronómetro:</strong> <span id="gameTimer">00:00</span></div>
            <div class="stats-coins-wrap">
                <img class="stats-coins-label" src="img/NUM MONEDAS.png" alt="Monedas">
                <span class="stats-coins-count" id="coinCount">0</span>
            </div>
            <div class="stats-text-row"><strong>Vida:</strong> <span id="lifeCount">100</span></div>
        </div>

        <footer class="hud-bottom">
            <div class="movement-controls">
                <img class="wasd-hint" src="img/wasd.png" alt="Controles WASD">
                <div class="hud-group">
                    <button class="game-button game-button-soft" type="button">Correr</button>
                    <button class="game-button game-button-soft" type="button">Agacharse</button>
                </div>
            </div>
            <div class="hud-group hud-group-actions">
                <button class="game-button game-button-main game-button-image" id="interactButton" type="button">Interactuar</button>
                <button class="game-button game-button-image" id="reactionsButton" type="button">Reacciones</button>
            </div>
        </footer>

        <section class="chat-popup" id="chatPopup" aria-live="polite" aria-label="Chat rápido">
            <div class="chat-popup-header">
                <span>Chat</span>
                <button class="chat-close" id="closeChatButton" type="button" aria-label="Cerrar chat">×</button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message npc">Jugador2: Acá hay mas monedassss</div>
            </div>
            <form class="chat-input-row" id="chatForm">
                <input id="chatInput" type="text" maxlength="120" placeholder="Escribe..." autocomplete="off">
                <button class="chat-send" type="submit">Enviar</button>
            </form>
        </section>

        <section class="reactions-popup" id="reactionsPopup" aria-label="Inventario de reacciones">
            <div class="reactions-popup-header">
                <span>Reacciones</span>
                <button class="reactions-close" id="closeReactionsButton" type="button" aria-label="Cerrar reacciones">×</button>
            </div>
            <div class="reactions-grid">
                <button class="reaction-item" type="button">Silbar</button>
                <button class="reaction-item" type="button">Saludar</button>
                <button class="reaction-item" type="button">Señalar</button>
                <button class="reaction-item" type="button">Distraer</button>
                <button class="reaction-item" type="button">Burlarse</button>
                <button class="reaction-item" type="button">Callar</button>
            </div>
        </section>

        <section class="inventory-popup" id="inventoryPopup" aria-label="Inventario del jugador">
            <div class="inventory-popup-header">
                <span>Inventario</span>
                <button class="inventory-close" id="closeInventoryButton" type="button" aria-label="Cerrar inventario">×</button>
            </div>
            <div class="inventory-grid">
                <button class="inventory-slot" type="button">🗝️</button>
                <button class="inventory-slot" type="button">💰</button>
                <button class="inventory-slot" type="button">📜</button>
                <button class="inventory-slot" type="button"></button>
                <button class="inventory-slot" type="button"></button>
                <button class="inventory-slot" type="button"></button>
                <button class="inventory-slot" type="button"></button>
                <button class="inventory-slot" type="button"></button>
                <button class="inventory-slot" type="button"></button>
            </div>
        </section>

        <section class="pause-modal" id="pauseModal" aria-label="Menú de pausa">
            <div class="pause-menu-panel">
                <img class="pause-modal-image" src="img/MENU-PAUSA.png" alt="Menú de pausa">
                <div class="pause-menu-actions">
                    <button class="pause-menu-btn" id="pauseResumeButton" type="button">Reanudar</button>
                    <button class="pause-menu-btn" id="pauseRestartButton" type="button">Reiniciar</button>
                    <button class="pause-menu-btn" id="pauseOptionsButton" type="button">Opciones</button>
                    <button class="pause-menu-btn" id="pauseExitButton" type="button">Salir</button>
                </div>
            </div>
        </section>

        <div id="pauseOptionsModal" class="options-modal" aria-hidden="true">
            <div class="options-panel" role="dialog" aria-modal="true" aria-labelledby="pauseOptionsTitle">
                <img class="options-panel-image" src="../../menu_inicial/img/MENU-OPTIONS.png" alt="Panel de opciones">
                <div class="options-panel-content">
                    <div class="options-header">
                        <img id="pauseOptionsTitle" class="options-title-image" src="../../menu_inicial/img/options.png" alt="Opciones">
                        <button id="closePauseOptionsButton" class="close-modal-button" type="button" aria-label="Cerrar">
                            ×
                        </button>
                    </div>

                    <div class="options-content">
                        <label class="option-row">
                            <span>Música</span>
                            <input id="pauseMusicRange" type="range" min="0" max="100" value="70">
                        </label>

                        <label class="option-row">
                            <span>Efectos de sonido</span>
                            <input id="pauseSfxRange" type="range" min="0" max="100" value="75">
                        </label>

                        <label class="option-row">
                            <span>Dificultad</span>
                            <select id="pauseDifficultySelect">
                                <option>Fácil</option>
                                <option selected>Normal</option>
                                <option>Difícil</option>
                            </select>
                        </label>

                        <label class="option-row option-check">
                            <span>Pantalla completa</span>
                            <input id="pauseFullscreenCheck" type="checkbox">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameParams = new URLSearchParams(window.location.search);
        const currentDifficulty = document.getElementById("currentDifficulty");
        const currentMusic = document.getElementById("currentMusic");
        const currentSfx = document.getElementById("currentSfx");
        const currentFullscreen = document.getElementById("currentFullscreen");
        const gameTimer = document.getElementById("gameTimer");
        const pauseButton = document.getElementById("pauseButton");
        const inventoryButton = document.getElementById("inventoryButton");
        const interactButton = document.getElementById("interactButton");
        const reactionsButton = document.getElementById("reactionsButton");
        const chatPopup = document.getElementById("chatPopup");
        const reactionsPopup = document.getElementById("reactionsPopup");
        const inventoryPopup = document.getElementById("inventoryPopup");
        const pauseModal = document.getElementById("pauseModal");
        const pauseResumeButton = document.getElementById("pauseResumeButton");
        const pauseRestartButton = document.getElementById("pauseRestartButton");
        const pauseOptionsButton = document.getElementById("pauseOptionsButton");
        const pauseExitButton = document.getElementById("pauseExitButton");
        const pauseOptionsModal = document.getElementById("pauseOptionsModal");
        const closePauseOptionsButton = document.getElementById("closePauseOptionsButton");
        const pauseDifficultySelect = document.getElementById("pauseDifficultySelect");
        const pauseMusicRange = document.getElementById("pauseMusicRange");
        const pauseSfxRange = document.getElementById("pauseSfxRange");
        const pauseFullscreenCheck = document.getElementById("pauseFullscreenCheck");
        const closeChatButton = document.getElementById("closeChatButton");
        const closeReactionsButton = document.getElementById("closeReactionsButton");
        const closeInventoryButton = document.getElementById("closeInventoryButton");
        const chatForm = document.getElementById("chatForm");
        const chatInput = document.getElementById("chatInput");
        const chatMessages = document.getElementById("chatMessages");
        const reactionItems = document.querySelectorAll(".reaction-item");

        const difficultyValue = gameParams.get("difficulty") || "Normal";
        const musicValue = gameParams.get("music") || "70";
        const sfxValue = gameParams.get("sfx") || "75";
        const fullscreenValue = gameParams.get("fullscreen") === "1" ? "Sí" : "No";
        const sfxVolume = Math.max(0, Math.min(100, Number(sfxValue) || 0)) / 100;

        let uiAudioContext;

        function addPlayerMessage(message) {
            const playerMessage = document.createElement("div");
            playerMessage.className = "chat-message player";
            playerMessage.textContent = "Tú: " + message;
            chatMessages.appendChild(playerMessage);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function playReactionSound() {
            if (sfxVolume <= 0) {
                return;
            }

            if (!uiAudioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) {
                    return;
                }
                uiAudioContext = new AudioContextClass();
            }

            const startTime = uiAudioContext.currentTime;
            const oscillator = uiAudioContext.createOscillator();
            const gain = uiAudioContext.createGain();

            oscillator.type = "triangle";
            oscillator.frequency.setValueAtTime(620, startTime);
            oscillator.frequency.exponentialRampToValueAtTime(780, startTime + 0.08);

            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(Math.max(0.01, sfxVolume * 0.18), startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.14);

            oscillator.connect(gain);
            gain.connect(uiAudioContext.destination);

            oscillator.start(startTime);
            oscillator.stop(startTime + 0.14);
        }

        currentDifficulty.textContent = difficultyValue;
        currentMusic.textContent = musicValue;
        currentSfx.textContent = sfxValue;
        currentFullscreen.textContent = fullscreenValue;

        let elapsedSeconds = 0;
        setInterval(function () {
            elapsedSeconds += 1;
            const minutes = String(Math.floor(elapsedSeconds / 60)).padStart(2, "0");
            const seconds = String(elapsedSeconds % 60).padStart(2, "0");
            gameTimer.textContent = minutes + ":" + seconds;
        }, 1000);

        interactButton.addEventListener("click", function () {
            inventoryPopup.classList.remove("is-open");
            reactionsPopup.classList.remove("is-open");
            chatPopup.classList.add("is-open");
            chatInput.focus();
        });

        reactionsButton.addEventListener("click", function () {
            inventoryPopup.classList.remove("is-open");
            chatPopup.classList.remove("is-open");
            reactionsPopup.classList.add("is-open");
        });

        inventoryButton.addEventListener("click", function () {
            pauseModal.classList.remove("is-open");
            chatPopup.classList.remove("is-open");
            reactionsPopup.classList.remove("is-open");
            inventoryPopup.classList.add("is-open");
        });

        pauseButton.addEventListener("click", function () {
            pauseOptionsModal.classList.remove("is-open");
            chatPopup.classList.remove("is-open");
            reactionsPopup.classList.remove("is-open");
            inventoryPopup.classList.remove("is-open");
            pauseModal.classList.add("is-open");
        });

        pauseModal.addEventListener("click", function (event) {
            if (event.target === pauseModal) {
                pauseModal.classList.remove("is-open");
            }
        });

        pauseResumeButton.addEventListener("click", function () {
            pauseModal.classList.remove("is-open");
        });

        pauseRestartButton.addEventListener("click", function () {
            location.reload();
        });

        pauseOptionsButton.addEventListener("click", function () {
            pauseModal.classList.remove("is-open");
            pauseOptionsModal.setAttribute("aria-hidden", "false");
            pauseDifficultySelect.value = currentDifficulty.textContent;
            pauseMusicRange.value = currentMusic.textContent;
            pauseSfxRange.value = currentSfx.textContent;
            pauseFullscreenCheck.checked = currentFullscreen.textContent === "Sí";
            pauseOptionsModal.classList.add("is-open");
        });

        function closePauseOptionsModal() {
            pauseOptionsModal.classList.remove("is-open");
            pauseOptionsModal.setAttribute("aria-hidden", "true");
            pauseModal.classList.add("is-open");
        }

        pauseOptionsModal.addEventListener("click", function (event) {
            if (event.target === pauseOptionsModal) {
                closePauseOptionsModal();
            }
        });

        closePauseOptionsButton.addEventListener("click", function () {
            closePauseOptionsModal();
        });

        pauseDifficultySelect.addEventListener("change", function () {
            currentDifficulty.textContent = pauseDifficultySelect.value;
        });

        pauseMusicRange.addEventListener("input", function () {
            currentMusic.textContent = pauseMusicRange.value;
        });

        pauseSfxRange.addEventListener("input", function () {
            currentSfx.textContent = pauseSfxRange.value;
        });

        pauseFullscreenCheck.addEventListener("change", function () {
            currentFullscreen.textContent = pauseFullscreenCheck.checked ? "Sí" : "No";
        });

        pauseExitButton.addEventListener("click", function () {
            window.location.href = "../../menu_inicial/index.html";
        });

        closeChatButton.addEventListener("click", function () {
            chatPopup.classList.remove("is-open");
        });

        closeReactionsButton.addEventListener("click", function () {
            reactionsPopup.classList.remove("is-open");
        });

        closeInventoryButton.addEventListener("click", function () {
            inventoryPopup.classList.remove("is-open");
        });

        // --- MOTOR 3D (Three.js) ---
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.setClearColor(0xdfd3be, 1);
        renderer.outputEncoding = THREE.sRGBEncoding; // Corrección de color para texturas

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdfd3be);
        scene.fog = new THREE.Fog(0xdfd3be, 50, 200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const ambientLight = new THREE.AmbientLight(0xffe4b5, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffd700, 1.2);
        sunLight.position.set(100, 100, 50);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const terrainGeometry = new THREE.PlaneGeometry(300, 300, 100, 100);
        terrainGeometry.rotateX(-Math.PI / 2);
        const vertices = terrainGeometry.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            const x = vertices[i];
            const z = vertices[i + 2];
            const dist = Math.sqrt(x*x + z*z);
            let h = Math.sin(x / 15) * Math.cos(z / 15) * 5;
            h += (Math.sin(x / 5) * 1);
            if (dist > 60) h += (dist - 60) * 0.4; 
            vertices[i + 1] = h;
        }
        terrainGeometry.computeVertexNormals();

        const terrainMaterial = new THREE.MeshStandardMaterial({ color: 0xedc9af, roughness: 0.8, metalness: 0.1 });
        const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
        terrain.receiveShadow = true;
        scene.add(terrain);

        const waterGeometry = new THREE.PlaneGeometry(600, 600);
        waterGeometry.rotateX(-Math.PI / 2);
        
        const textureLoader = new THREE.TextureLoader();
        const waterTexture = textureLoader.load("../../../Models/Barco Pirata/pirate_seaBaseB.png");
        waterTexture.wrapS = THREE.RepeatWrapping;
        waterTexture.wrapT = THREE.RepeatWrapping;
        waterTexture.repeat.set(60, 60); // Ajuste a la mitad para hacer las olas más grandes sin llegar al exagerado tamaño original

        const waterMaterial = new THREE.MeshStandardMaterial({ 
            map: waterTexture, 
            transparent: true, 
            opacity: 0.9, 
            roughness: 0.1,
            metalness: 0.2
        });
        const water = new THREE.Mesh(waterGeometry, waterMaterial);
        water.position.y = 1.0;
        scene.add(water);

        const playerGroup = new THREE.Group();
        const playerVisual = new THREE.Group();
        playerGroup.add(playerVisual);

        const placeholderMaterial = new THREE.MeshStandardMaterial({ color: 0xff4500 });
        const placeholderBody = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1, 0.4), placeholderMaterial);
        placeholderBody.position.y = 0.5;
        placeholderBody.castShadow = true;
        playerVisual.add(placeholderBody);
        const placeholderHead = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), placeholderMaterial);
        placeholderHead.position.y = 1.15;
        placeholderHead.castShadow = true;
        playerVisual.add(placeholderHead);

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        function fitModelToPlayer(modelRoot) {
            const box = new THREE.Box3().setFromObject(modelRoot);
            const size = new THREE.Vector3();
            box.getSize(size);
            if (!isFinite(size.y) || size.y === 0) return;
            const desiredHeight = 3.6; // Lo he hecho el doble de grande (antes 1.8)
            const scale = desiredHeight / size.y;
            modelRoot.scale.setScalar(scale);

            const box2 = new THREE.Box3().setFromObject(modelRoot);
            const center = new THREE.Vector3();
            box2.getCenter(center);
            modelRoot.position.x -= center.x;
            modelRoot.position.z -= center.z;
            modelRoot.position.y -= box2.min.y;
        }

        function attachPirateModel(obj) {
            obj.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(m => {
                            m.side = THREE.DoubleSide;
                            // El archivo MTL original venía con un color gris muy oscuro (0.58) base
                            // Lo forzamos a blanco puro (0xffffff) para que se vean los colores de la textura reales
                            if (m.color) m.color.setHex(0xffffff);
                        });
                    }
                }
            });
            obj.rotation.y = Math.PI;
            fitModelToPlayer(obj);
            playerVisual.clear();
            playerVisual.add(obj);
        }

        const pirateBasePath = "../../../Models/Pirata/";
        const shipBasePath = "../../../Models/Barco Pirata/";
        const hasMTLLoader = typeof THREE.MTLLoader === "function";
        const hasOBJLoader = typeof THREE.OBJLoader === "function";

        if (!hasMTLLoader || !hasOBJLoader) {
            console.warn("MTLLoader/OBJLoader no disponibles.");
        } else {
            // CARGAR JUGADOR PIRATA
            const mtlLoader = new THREE.MTLLoader();
            mtlLoader.setPath(pirateBasePath);
            mtlLoader.load("THUG 2 - Pirate.mtl", (materials) => {
                materials.preload();
                const objLoader = new THREE.OBJLoader();
                objLoader.setMaterials(materials);
                objLoader.setPath(pirateBasePath);
                objLoader.load("THUG 2 - Pirate.obj", attachPirateModel, undefined, e => console.error(e));
            }, undefined, (e) => {
                console.error("Fallo MTL de Jugador, intentando solo OBJ:", e);
                const objLoader = new THREE.OBJLoader();
                objLoader.setPath(pirateBasePath);
                objLoader.load("THUG 2 - Pirate.obj", attachPirateModel, undefined, err => console.error(err));
            });

            // CARGAR BARCO PIRATA
            const shipMtlLoader = new THREE.MTLLoader();
            shipMtlLoader.setPath(shipBasePath);
            shipMtlLoader.load("DolPirate.mtl", (materials) => {
                materials.preload();
                const shipObjLoader = new THREE.OBJLoader();
                shipObjLoader.setMaterials(materials);
                shipObjLoader.setPath(shipBasePath);
                shipObjLoader.load("DolPirate.obj", attachShipModel, undefined, e => console.error("Error cargando Barco OBJ", e));
            }, undefined, e => {
                console.error("Fallo MTL de Barco, intentando solo OBJ:", e);
                const shipObjLoader = new THREE.OBJLoader();
                shipObjLoader.setPath(shipBasePath);
                shipObjLoader.load("DolPirate.obj", attachShipModel, undefined, err => console.error(err));
            });

            function attachShipModel(obj) {
                obj.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            const mats = Array.isArray(child.material) ? child.material : [child.material];
                            mats.forEach(m => {
                                m.side = THREE.DoubleSide;
                                if (m.color && typeof m.color.setHex === 'function') {
                                    m.color.setHex(0xffffff);
                                }
                            });
                        }
                    }
                });
                
                // Ajustar y colocar en la pantalla visible inicialmente
                obj.scale.set(2.4, 2.4, 2.4); // Reducido a la mitad (de 4.8 a 2.4)
                obj.position.set(-21.35, 1.00, 4.89); // Coordenadas personalizadas del usuario
                obj.rotation.y = Math.PI / 4 + Math.PI + (Math.PI / 2); // Girado 90 grados (+ Pi/2) respecto a donde estaba
                
                window.pirateShip = obj;
                scene.add(obj);
                console.log("Barco Pirata agregado a la escena!");
                window.iniciarProps(scene);
            }
        }

        window.iniciarProps = function(scene) {
            window.escenarioPirata = { botes: [], monedas: [] };

            function cargarProp(carpeta, nombreMTL, nombreOBJ, propScale, posX, posY, posZ, rotY = 0) {
                const basePath = "../../../Models/" + carpeta + "/";
                const propMtlLoader = new THREE.MTLLoader();
                propMtlLoader.setPath(basePath);
                propMtlLoader.load(encodeURI(nombreMTL), (materials) => {
                    materials.preload();
                    const propObjLoader = new THREE.OBJLoader();
                    propObjLoader.setMaterials(materials);
                    propObjLoader.setPath(basePath);
                    propObjLoader.load(encodeURI(nombreOBJ), configurarProp, undefined, e => console.error("Error", nombreOBJ, e));
                }, undefined, e => {
                    const propObjLoader = new THREE.OBJLoader();
                    propObjLoader.setPath(basePath);
                    propObjLoader.load(encodeURI(nombreOBJ), configurarProp, undefined, err => console.error(err));
                });

                function configurarProp(obj) {
                    obj.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                const mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach(m => {
                                    m.side = THREE.DoubleSide;
                                    if (m.color && typeof m.color.setHex === 'function') m.color.setHex(0xffffff);
                                });
                            }
                        }
                    });
                    obj.scale.setScalar(propScale);
                    obj.position.set(posX, posY, posZ);
                    obj.rotation.y = rotY;
                    obj.userData.baseY = posY;
                    scene.add(obj);

                    if (carpeta === "Bote") window.escenarioPirata.botes.push(obj);
                    if (carpeta === "Moneda") window.escenarioPirata.monedas.push(obj);
                }
            }

            cargarProp("Bote", "Egyptian Boat.mtl", "Egyptian Boat.obj", 0.05, -15, 1.0, 15, Math.PI/3);
           
            
            // Nuevos Cactus esparcidos ampliamente a lo largo de las dunas lejanas
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.55, -23.89, 5.24, -59.24, 0.5); // Mantiene el origen pedido
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.425, -11.55, 3.08, -65.67, Math.PI/4); // Esparcido muy a la derecha
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.675, -45.5, 2.9, -49.5, Math.PI/3); // Esparcido muy a la izquierda
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.55, -15.15, 6.45, -85.91, 1.2); // Más profundo hacia el fondo del mapa

            // Cactus agregados por ubicación del jugador
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.55, 30.56, 4.27, 1.72, Math.random() * Math.PI);
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.675, 20.01, 2.26, -13.51, Math.random() * Math.PI);
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.425, 26.44, 2.21, -13.50, Math.random() * Math.PI);
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.5, 31.87, 3.35, -10.45, Math.random() * Math.PI);
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.6, 29.47, 4.00, -4.79, Math.random() * Math.PI);
            cargarProp("Cactus", "Cactus.mtl", "Cactus.obj", 0.6, 10.84, 2.71, 14.48, Math.random() * Math.PI);
            
            cargarProp("Cofre1", "GoldTrunk.mtl", "GoldTrunk.obj", 2.0, 21.09, 4.03, -1.39, Math.PI/7); // Junto al bote
            
            cargarProp("Moneda", "Gold Coin.mtl", "Gold Coin.obj", 2.2, 19.77, 3.93, -4.22, Math.PI/7);

            // Nueva casa del alcalde (Mayor's House)
            cargarProp("Mayor's House", "e01h06.mtl", "e01h06.obj", 0.10, 10.0, -0.5, -25.0, 0);
        };

        const keys = { w: false, a: false, s: false, d: false, shift: false, control: false, " ": false };
        let moveSpeed = 0.15;
        const baseSpeed = 0.15;
        const runSpeed = 0.3;
        const crouchSpeed = 0.075;
        const rotateSpeed = 0.05;
        let velocityY = 0;
        const gravity = -0.015;
        const jumpForce = 0.3;
        let isGrounded = true;

        let isRightMouseDown = false;
        let cameraAzimuth = 0;
        let cameraPolar = Math.PI / 4;
        let cameraDistance = 10;

        window.addEventListener('mousedown', (e) => { if (e.button === 2) isRightMouseDown = true; });
        window.addEventListener('mouseup', (e) => { if (e.button === 2) isRightMouseDown = false; });
        window.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('wheel', (e) => {
            cameraDistance += e.deltaY * 0.01;
            cameraDistance = Math.max(3, Math.min(40, cameraDistance)); // Limitar zoom in (3) y zoom out (40)
        });
        window.addEventListener('mousemove', (e) => {
            if (isRightMouseDown) {
                cameraAzimuth -= e.movementX * 0.005;
                cameraPolar = Math.max(0.1, Math.min(Math.PI / 2.1, cameraPolar + e.movementY * 0.005));
            }
        });

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
            if (e.shiftKey || e.key === "Shift") keys.shift = true;
            if (e.ctrlKey || e.key === "Control") keys.control = true;
            if (e.key === " ") {
                keys[" "] = true;
                if (isGrounded && !keys.control) { velocityY = jumpForce; isGrounded = false; }
            }
            if (key === 'm') {
                alert(`Coordenadas del Pirata:\nX: ${playerGroup.position.x.toFixed(2)}\nY: ${playerGroup.position.y.toFixed(2)}\nZ: ${playerGroup.position.z.toFixed(2)}`);
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
            if (e.key === "Shift") keys.shift = false;
            if (e.key === "Control") keys.control = false;
            if (e.key === " ") keys[" "] = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (keys.control) moveSpeed = crouchSpeed;
            else if (keys.shift) moveSpeed = runSpeed;
            else moveSpeed = baseSpeed;

            if (keys.w) playerGroup.translateZ(-moveSpeed);
            if (keys.s) playerGroup.translateZ(moveSpeed);
            if (keys.a) playerGroup.rotation.y += rotateSpeed;
            if (keys.d) playerGroup.rotation.y -= rotateSpeed;

            const walkCycle = Date.now() * (keys.shift && !keys.control ? 0.02 : 0.01);
            if (keys.control) {
                playerGroup.scale.set(1.0, 0.6, 1.0);
                playerVisual.position.y = 0;
            } else {
                playerGroup.scale.set(1.0, 1.0, 1.0);
                if (keys.w || keys.s || keys.a || keys.d) playerVisual.position.y = Math.abs(Math.sin(walkCycle)) * 0.1;
                else playerVisual.position.y = 0;
            }

            const terrainHeight = (Math.sin(playerGroup.position.x / 15) * Math.cos(playerGroup.position.z / 15) * 5) + 
                                (Math.sin(playerGroup.position.x / 5) * 1);
            const dist = Math.sqrt(playerGroup.position.x**2 + playerGroup.position.z**2);
            let finalHeight = terrainHeight;
            if (dist > 60) finalHeight += (dist - 60) * 0.4;
            
            const floorLevel = Math.max(finalHeight, 1.0);
            velocityY += gravity;
            playerGroup.position.y += velocityY;

            if (playerGroup.position.y <= floorLevel) {
                playerGroup.position.y = floorLevel;
                velocityY = 0;
                isGrounded = true;
            }

            const angle = playerGroup.rotation.y + cameraAzimuth;
            const x = Math.sin(angle) * Math.cos(cameraPolar) * cameraDistance;
            const y = Math.sin(cameraPolar) * cameraDistance;
            const z = Math.cos(angle) * Math.cos(cameraPolar) * cameraDistance;

            camera.position.set(playerGroup.position.x + x, playerGroup.position.y + y, playerGroup.position.z + z);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            if (window.pirateShip) {
                const time = performance.now() * 0.001;
                window.pirateShip.position.y = 0.9 + Math.sin(time) * 0.15;
                window.pirateShip.rotation.x = Math.sin(time * 0.5) * 0.02;
                window.pirateShip.rotation.z = Math.cos(time * 0.5) * 0.02;
            }

            // Animar el escenario pirata
            if (window.escenarioPirata) {
                const time = performance.now() * 0.001;
                window.escenarioPirata.botes.forEach(bote => {
                    bote.position.y = (bote.userData.baseY || 0.9) + Math.sin(time * 2) * 0.1;
                    bote.rotation.z = Math.sin(time) * 0.05;
                });
                window.escenarioPirata.monedas.forEach((moneda, index) => {
                    moneda.rotation.y = time * 2 + index; // Que giren sobre sí mismas
                    moneda.position.y = (moneda.userData.baseY || 1.0) + Math.sin(time * 3 + index) * 0.05; // Que floten brillando un poco
                });
            }

            // Animar la textura del agua y su altura simulando olas
            if (water) {
                const time = performance.now() * 0.001;
                water.position.y = 1.0 + Math.sin(time) * 0.1;
                if (water.material.map) {
                    water.material.map.offset.x -= 0.0002; // Ajuste de velocidad proporcional
                    water.material.map.offset.y += 0.0002; 
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        chatForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const message = chatInput.value.trim();
            if (!message) {
                return;
            }

            addPlayerMessage(message);
            chatInput.value = "";
        });

        reactionItems.forEach(function (reactionButton) {
            reactionButton.addEventListener("click", function () {
                const reactionText = reactionButton.textContent.trim();
                if (!reactionText) {
                    return;
                }

                addPlayerMessage(reactionText);
                playReactionSound();
                reactionsPopup.classList.remove("is-open");
                chatPopup.classList.add("is-open");
            });
        });
    </script>
</body>
</html>
