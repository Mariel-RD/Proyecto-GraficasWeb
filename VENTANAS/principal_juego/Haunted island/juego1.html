    <script>
        const gameParams = new URLSearchParams(window.location.search);
        const currentPlayerName = document.getElementById("currentPlayerName");
        const currentDifficulty = document.getElementById("currentDifficulty");
        const currentMusic = document.getElementById("currentMusic");
        const currentSfx = document.getElementById("currentSfx");
        const currentFullscreen = document.getElementById("currentFullscreen");
        const gameTimer = document.getElementById("gameTimer");
        const pauseButton = document.getElementById("pauseButton");
        const coinCount = document.getElementById("coinCount");
        const stealToast = document.getElementById("stealToast");
        const inventoryButton = document.getElementById("inventoryButton");
        const interactButton = document.getElementById("interactButton");
        const reactionsButton = document.getElementById("reactionsButton");
        const chatPopup = document.getElementById("chatPopup");
        const reactionsPopup = document.getElementById("reactionsPopup");
        const inventoryPopup = document.getElementById("inventoryPopup");
        const pauseModal = document.getElementById("pauseModal");
        const gameOverModal = document.getElementById("gameOverModal");
        const gameOverTitle = document.getElementById("gameOverTitle");
        const gameOverMessage = document.getElementById("gameOverMessage");
        const gameOverScores = document.getElementById("gameOverScores");
        const gameOverRestartButton = document.getElementById("gameOverRestartButton");
        const gameOverExitButton = document.getElementById("gameOverExitButton");
        const pauseResumeButton = document.getElementById("pauseResumeButton");
        const pauseRestartButton = document.getElementById("pauseRestartButton");
        const pauseOptionsButton = document.getElementById("pauseOptionsButton");
        const pauseExitButton = document.getElementById("pauseExitButton");
        const closePauseMenuCrossButton = document.getElementById("closePauseMenuCrossButton");
        const pauseOptionsModal = document.getElementById("pauseOptionsModal");
        const closePauseOptionsButton = document.getElementById("closePauseOptionsButton");
        const pauseDifficultySelect = document.getElementById("pauseDifficultySelect");
        const pauseMusicRange = document.getElementById("pauseMusicRange");
        const pauseSfxRange = document.getElementById("pauseSfxRange");
        const pauseFullscreenCheck = document.getElementById("pauseFullscreenCheck");
        const closeChatButton = document.getElementById("closeChatButton");
        const closeReactionsButton = document.getElementById("closeReactionsButton");
        const closeInventoryButton = document.getElementById("closeInventoryButton");
        const chatForm = document.getElementById("chatForm");
        const chatInput = document.getElementById("chatInput");
        const chatMessages = document.getElementById("chatMessages");
        const reactionItems = document.querySelectorAll(".reaction-item");

        const difficultyValue = gameParams.get("difficulty") || "Normal";
        const musicValue = gameParams.get("music") || "70";
        const sfxValue = gameParams.get("sfx") || "75";
        const fullscreenValue = gameParams.get("fullscreen") === "1" ? "SÃƒÂ­" : "No";
        const playerNameValue = (gameParams.get("playerName") || localStorage.getItem("playerName") || sessionStorage.getItem("playerName") || "Jugador").trim() || "Jugador";
        let sfxVolume = Math.max(0, Math.min(100, Number(sfxValue) || 0)) / 100;

        // --- MÃƒÂºsica de fondo ---
        const bgMusic = new Audio("../../../Models1/music1.mp3");
        bgMusic.loop = true;
        bgMusic.volume = Math.max(0, Math.min(100, Number(musicValue) || 0)) / 100;
        bgMusic.play().catch(function () {
            function startBgMusic() {
                bgMusic.play().catch(function () {});
                document.removeEventListener("click", startBgMusic);
                document.removeEventListener("keydown", startBgMusic);
            }
            document.addEventListener("click", startBgMusic, { once: true });
            document.addEventListener("keydown", startBgMusic, { once: true });
        });

        const localPlayerId = sessionStorage.getItem("multiplayerPlayerId") || (
            window.crypto && typeof window.crypto.randomUUID === "function"
                ? window.crypto.randomUUID()
                : String(Date.now()) + Math.random().toString(16).slice(2)
        );
        const multiplayerRoom = gameParams.get("room") || "haunted-island-room";
        const multiplayerServerUrl = localStorage.getItem("multiplayerServerUrl") || window.location.origin;
        const socket = typeof io === "function"
            ? io(multiplayerServerUrl, { transports: ["websocket", "polling"] })
            : null;

        sessionStorage.setItem("multiplayerPlayerId", localPlayerId);
        localStorage.setItem("multiplayerRoom", multiplayerRoom);

        // --- Sonidos de pasos ---
        const walkSoundTierra = new Audio("../../../sounds/Caminar-Tierra.mp3");
        walkSoundTierra.loop = true;
        walkSoundTierra.volume = sfxVolume;

        const walkSoundAgua = new Audio("../../../sounds/Caminar-Agua2.mp3");
        walkSoundAgua.loop = true;
        walkSoundAgua.volume = sfxVolume;

        let currentFootstepSound = null; // cuÃƒÂ¡l estÃƒÂ¡ sonando ahora

        function updateFootstepSounds() {
            const isMoving = (keys.w || keys.s) && isGrounded && !isPirateJumping && !isPaused && !isGameOver;
            const isRunning = isMoving && keys.shift && !keys.control;
            const rate = isRunning ? 1.55 : 1.0;

            if (isMoving) {
                // Detectar si el jugador estÃƒÂ¡ en agua usando la misma fÃƒÂ³rmula del terreno
                const px = playerGroup.position.x;
                const pz = playerGroup.position.z;
                const terrH = (Math.sin(px / 15) * Math.cos(pz / 15) * 5) + (Math.sin(px / 5) * 1);
                const pdist = Math.sqrt(px * px + pz * pz);
                const finalH = pdist > 60 ? terrH + (pdist - 60) * 0.4 : terrH;
                const inWater = finalH < 1.0;

                const targetSound = inWater ? walkSoundAgua : walkSoundTierra;
                const otherSound  = inWater ? walkSoundTierra : walkSoundAgua;

                // Detener el sonido que no corresponde
                if (!otherSound.paused) {
                    otherSound.pause();
                    otherSound.currentTime = 0;
                }

                // Reproducir el correcto
                targetSound.playbackRate = rate;
                targetSound.volume = sfxVolume;
                if (targetSound.paused) {
                    targetSound.play().catch(function () {});
                }
                currentFootstepSound = targetSound;
            } else {
                // Detener ambos si el jugador no se mueve
                if (!walkSoundTierra.paused) {
                    walkSoundTierra.pause();
                }
                if (!walkSoundAgua.paused) {
                    walkSoundAgua.pause();
                }
                currentFootstepSound = null;
            }
        }

        let uiAudioContext;
    let collectedCoins = 0;

        function addPlayerMessage(message) {
            const playerMessage = document.createElement("div");
            playerMessage.className = "chat-message player";
            playerMessage.textContent = "TÃƒÂº: " + message;
            chatMessages.appendChild(playerMessage);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMessage(message) {
            const systemMessage = document.createElement("div");
            systemMessage.className = "chat-message npc";
            systemMessage.textContent = message;
            chatMessages.appendChild(systemMessage);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        let stealToastTimer;
        function showStealToast(message) {
            stealToast.textContent = message;
            stealToast.classList.add("is-open");
            clearTimeout(stealToastTimer);
            stealToastTimer = setTimeout(function () {
                stealToast.classList.remove("is-open");
            }, 2200);
        }

        function playReactionSound() {
            if (sfxVolume <= 0) {
                return;
            }

            if (!uiAudioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) {
                    return;
                }
                uiAudioContext = new AudioContextClass();
            }

            const startTime = uiAudioContext.currentTime;
            const oscillator = uiAudioContext.createOscillator();
            const gain = uiAudioContext.createGain();

            oscillator.type = "triangle";
            oscillator.frequency.setValueAtTime(620, startTime);
            oscillator.frequency.exponentialRampToValueAtTime(780, startTime + 0.08);

            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(Math.max(0.01, sfxVolume * 0.18), startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.14);

            oscillator.connect(gain);
            gain.connect(uiAudioContext.destination);

            oscillator.start(startTime);
            oscillator.stop(startTime + 0.14);
        }

        currentDifficulty.textContent = difficultyValue;
        currentMusic.textContent = musicValue;
        currentSfx.textContent = sfxValue;
        currentFullscreen.textContent = fullscreenValue;
        currentPlayerName.textContent = playerNameValue;
        coinCount.textContent = String(collectedCoins);
        document.title = "Haunted Island - " + playerNameValue;

        let isGameOver = false;
        let isPaused = false;
        let pauseStartTime = 0;
        let remainingSeconds = 60;
        let roomTimerStartedAt = Date.now();
        let roomTimerDurationSeconds = 60;
        let roomTimerServerOffset = 0;
        let stealRequestPending = false;
        const coinCountsByPlayer = new Map([[localPlayerId, 0]]);

        function updateGameTimer() {
            const minutes = String(Math.floor(remainingSeconds / 60)).padStart(2, "0");
            const seconds = String(remainingSeconds % 60).padStart(2, "0");
            gameTimer.textContent = minutes + ":" + seconds;
        }

        function updateCoinCounts(coinCounts) {
            if (!coinCounts || typeof coinCounts !== "object") {
                return;
            }

            Object.entries(coinCounts).forEach(function ([playerId, count]) {
                coinCountsByPlayer.set(playerId, Number(count) || 0);
            });
            collectedCoins = coinCountsByPlayer.get(localPlayerId) || 0;
            coinCount.textContent = String(collectedCoins);
        }

        function getPlayerDisplayName(playerId) {
            if (playerId === localPlayerId) {
                return playerNameValue;
            }

            const remote = remotePlayers.get(playerId);
            return remote && remote.userData && remote.userData.playerName
                ? remote.userData.playerName
                : "Jugador";
        }

        function isHardDifficulty() {
            return currentDifficulty.textContent.toLowerCase().includes("dif");
        }

        function finishGame() {
            if (isGameOver) {
                return;
            }

            isGameOver = true;
            const myCoins = coinCountsByPlayer.get(localPlayerId) || collectedCoins;
            coinCountsByPlayer.set(localPlayerId, myCoins);
            const scores = Array.from(coinCountsByPlayer.entries());
            const lowestCoins = Math.min(...scores.map(([, count]) => count));
            const highestCoins = Math.max(...scores.map(([, count]) => count));

            if (highestCoins === lowestCoins) {
                gameOverTitle.textContent = "Empate";
                gameOverMessage.textContent = "Nadie pierde: ambos juntaron " + myCoins + " monedas.";
            } else if (myCoins === lowestCoins) {
                gameOverTitle.textContent = "Perdiste";
                gameOverMessage.textContent = "Te quedaste con menos monedas.";
            } else {
                gameOverTitle.textContent = "Ganaste";
                gameOverMessage.textContent = "Tu rival juntÃƒÂ³ menos monedas.";
            }

            gameOverScores.textContent = scores
                .map(function ([playerId, count]) {
                    return getPlayerDisplayName(playerId) + ": " + count;
                })
                .join(" | ");

            chatPopup.classList.remove("is-open");
            reactionsPopup.classList.remove("is-open");
            inventoryPopup.classList.remove("is-open");
            pauseModal.classList.remove("is-open");
            pauseOptionsModal.classList.remove("is-open");
            bgMusic.pause();
            bgMusic.currentTime = 0;
            gameOverModal.classList.add("is-open");
        }

        function applyRoomTimer(timer) {
            if (!timer || typeof timer.startedAt !== "number" || typeof timer.durationSeconds !== "number") {
                return;
            }

            roomTimerStartedAt = timer.startedAt;
            roomTimerDurationSeconds = timer.durationSeconds;
            roomTimerServerOffset = (typeof timer.serverNow === "number" ? timer.serverNow : Date.now()) - Date.now();
            updateSharedTimer();
        }

        function updateSharedTimer() {
            if (isPaused || isGameOver) {
                return;
            }

            const estimatedServerNow = Date.now() + roomTimerServerOffset;
            const elapsedSeconds = Math.floor((estimatedServerNow - roomTimerStartedAt) / 1000);
            remainingSeconds = Math.max(0, roomTimerDurationSeconds - elapsedSeconds);
            updateGameTimer();

            if (remainingSeconds === 0) {
                finishGame();
            }
        }

        updateSharedTimer();
        setInterval(function () {
            if (!isGameOver) {
                updateSharedTimer();
            }
        }, 1000);

        interactButton.addEventListener("click", function () {
            inventoryPopup.classList.remove("is-open");
            reactionsPopup.classList.remove("is-open");
            chatPopup.classList.add("is-open");
            chatInput.focus();
        });

        reactionsButton.addEventListener("click", function () {
            inventoryPopup.classList.remove("is-open");
            chatPopup.classList.remove("is-open");
            reactionsPopup.classList.add("is-open");
        });

        inventoryButton.addEventListener("click", function () {
            pauseModal.classList.remove("is-open");
            chatPopup.classList.remove("is-open");
            reactionsPopup.classList.remove("is-open");
            inventoryPopup.classList.add("is-open");
        });

        pauseButton.addEventListener("click", function () {
            pauseOptionsModal.classList.remove("is-open");
            chatPopup.classList.remove("is-open");
            reactionsPopup.classList.remove("is-open");
            inventoryPopup.classList.remove("is-open");
            pauseModal.classList.add("is-open");
            if (!isPaused) {
                isPaused = true;
                pauseStartTime = Date.now();
                bgMusic.pause();
            }
        });

        pauseModal.addEventListener("click", function (event) {
            if (event.target === pauseModal) {
                pauseModal.classList.remove("is-open");
            }
        });

        function resumeGameFromPause() {
            pauseModal.classList.remove("is-open");
            if (isPaused) {
                isPaused = false;
                bgMusic.play().catch(function () {});
                if (pauseStartTime > 0) {
                    roomTimerStartedAt += (Date.now() - pauseStartTime);
                    pauseStartTime = 0;
                }
            }
        }

        pauseResumeButton.addEventListener("click", resumeGameFromPause);
        closePauseMenuCrossButton.addEventListener("click", resumeGameFromPause);

        pauseRestartButton.addEventListener("click", function () {
            location.reload();
        });

        pauseOptionsButton.addEventListener("click", function () {
            pauseModal.classList.remove("is-open");
            pauseOptionsModal.setAttribute("aria-hidden", "false");
            pauseDifficultySelect.value = currentDifficulty.textContent;
            pauseMusicRange.value = currentMusic.textContent;
            pauseSfxRange.value = currentSfx.textContent;
            pauseFullscreenCheck.checked = currentFullscreen.textContent === "SÃƒÂ­";
            pauseOptionsModal.classList.add("is-open");
        });

        function closePauseOptionsModal() {
            pauseOptionsModal.classList.remove("is-open");
            pauseOptionsModal.setAttribute("aria-hidden", "true");
            pauseModal.classList.add("is-open");
        }

        pauseOptionsModal.addEventListener("click", function (event) {
            if (event.target === pauseOptionsModal) {
                closePauseOptionsModal();
            }
        });

        closePauseOptionsButton.addEventListener("click", function () {
            closePauseOptionsModal();
        });

        pauseDifficultySelect.addEventListener("change", function () {
            currentDifficulty.textContent = pauseDifficultySelect.value;
        });

        pauseMusicRange.addEventListener("input", function () {
            currentMusic.textContent = pauseMusicRange.value;
            bgMusic.volume = Number(pauseMusicRange.value) / 100;
        });

        pauseSfxRange.addEventListener("input", function () {
            currentSfx.textContent = pauseSfxRange.value;
            const newVol = Number(pauseSfxRange.value) / 100;
            sfxVolume = newVol;          // sincronizar la variable usada en updateFootstepSounds()
            walkSoundTierra.volume = newVol;
            walkSoundAgua.volume = newVol;
        });

        pauseFullscreenCheck.addEventListener("change", function () {
            const enable = pauseFullscreenCheck.checked;
            currentFullscreen.textContent = enable ? "SÃƒÂ­" : "No";
            if (enable) {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => console.warn(err));
                }
            } else {
                if (document.fullscreenElement && document.exitFullscreen) {
                    document.exitFullscreen().catch(err => console.warn(err));
                }
            }
        });

            if (!window.escenarioPirata || !Array.isArray(window.escenarioPirata.monedas)) {

            const coins = window.escenarioPirata.monedas.slice();
            coins.forEach((coin) => {
                if (!coin || !coin.userData || !coin.userData.coinId) {
                    return;

                if (collectedCoinIds.has(coin.userData.coinId)) {
                    return;

                const distance = playerGroup.position.distanceTo(coin.position);

                if (remoteCoins <= 0) {

                const distance = playerGroup.position.distanceTo(remote.position);
                if (distance <= 4 && distance < nearestDistance) {

                    nearestTargetId = playerId;

        function fitModelToPlayer(modelRoot) {
            const box = new THREE.Box3().setFromObject(modelRoot);
            const size = new THREE.Vector3();
            box.getSize(size);
            if (!isFinite(size.y) || size.y === 0) return;
            const desiredHeight = 3.6; // Lo he hecho el doble de grande (antes 1.8)
            const scale = desiredHeight / size.y;
            modelRoot.scale.setScalar(scale);

            const box2 = new THREE.Box3().setFromObject(modelRoot);
            const center = new THREE.Vector3();
            box2.getCenter(center);
            modelRoot.position.x -= center.x;
            modelRoot.position.z -= center.z;
            modelRoot.position.y -= box2.min.y;
        }

        const obstacleCollisionMargin = 0.3;
        const playerHalfExtents = new THREE.Vector3(0.6, 1.4, 0.6);
        const obstacleColliders = [];

        function addObstacleCollider(obj) {
            if (!obj) {
                return;
            }
            obstacleColliders.push(obj);
        }

        function createPlayerBox(position) {
            const min = new THREE.Vector3(
                position.x - playerHalfExtents.x,
                position.y - playerHalfExtents.y,
                position.z - playerHalfExtents.z
            );
            const max = new THREE.Vector3(
                position.x + playerHalfExtents.x,
                position.y + playerHalfExtents.y,
                position.z + playerHalfExtents.z
            );
            return new THREE.Box3(min, max);
        }

        function isObstacleCollision(position) {
            const playerBox = createPlayerBox(position);
            for (let i = 0; i < obstacleColliders.length; i += 1) {
                const obstacle = obstacleColliders[i];
                if (!obstacle || !obstacle.parent) {
                    continue;
                }
                const box = new THREE.Box3().setFromObject(obstacle);
                box.expandByScalar(obstacleCollisionMargin);
                if (box.intersectsBox(playerBox)) {
                    return true;
                }
            }
            return false;
        }

        function ensurePirateAction(name) {
            if (!pirateMixer || !pirateClips[name]) {
                return null;
            }
            if (!pirateActions[name]) {
                pirateActions[name] = pirateMixer.clipAction(pirateClips[name]);
            }
            return pirateActions[name];
        }

        function getDesiredMoveActionName() {
            if (keys.w && keys.shift && !keys.control) {
                return "run";
            }
            if (keys.w && !keys.shift && !keys.control) {
                return "walk";
            }
            return "idle";
        }

        function setPirateAction(name, fade = 0.15, force = false) {
            if (!pirateMixer) {
                return;
            }
            const action = ensurePirateAction(name);
            if (!action) {
                return;
            }
            if (!force && currentPirateAction === action) {
                return;
            }

            if (currentPirateAction && currentPirateAction !== action) {
                currentPirateAction.fadeOut(fade);
            }

            action.reset();
            action.fadeIn(fade);
            action.play();
            currentPirateAction = action;
        }

        function handlePirateJumpAction() {
            const action = ensurePirateAction("jump");
            if (!action) {
                return;
            }
            isPirateJumping = true;
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            setPirateAction("jump", 0.05, true);
        }

        function attachPirateFbxModel(obj) {
            let meshCount = 0;
            obj.traverse((child) => {
                if (child.isMesh) {
                    meshCount += 1;
                    child.castShadow = true;
                    child.receiveShadow = true;
                    child.frustumCulled = false;
                    if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(m => {
                            m.side = THREE.DoubleSide;
                            if (m.color) m.color.setHex(0xffffff);
                        });
                    }
                }
            });
            if (!meshCount) {
                console.warn("FBX sin mesh visible, usando OBJ del pirata.");
                loadPirateObjFallback();
                return;
            }

            obj.rotation.y = Math.PI;
            fitModelToPlayer(obj);
            playerVisual.clear();
            playerVisual.add(obj);

            pirateMixer = new THREE.AnimationMixer(obj);
            pirateActions = {};
            currentPirateAction = null;

            if (obj.animations && obj.animations.length) {
                pirateClips.idle = obj.animations[0];
            }

            pirateMixer.addEventListener("finished", function (event) {
                if (!event || !event.action) {
                    return;
                }
                if (event.action === pirateActions.jump) {
                    isPirateJumping = false;
                    setPirateAction(getDesiredMoveActionName(), 0.1, true);
                }
            });

            setPirateAction(getDesiredMoveActionName(), 0.1, true);
        }

        window.iniciarProps = function(scene) {
            window.escenarioPirata = { botes: [], monedas: [], props: [] };
            let coinSpawnIndex = 0;

            function seededRandom(seed) {
                const x = Math.sin(seed) * 10000;
                return x - Math.floor(x);
            }

            function getTerrainHeightAt(posX, posZ) {
                let terrainHeight = Math.sin(posX / 18) * Math.cos(posZ / 16) * 3.3;
                terrainHeight += Math.sin((posX + posZ) / 8) * 0.9;
                const dist = Math.sqrt(posX**2 + posZ**2);
                return dist > 70 ? terrainHeight + (dist - 70) * 0.28 : terrainHeight;
            }

            function cargarProp(sourceRoot, carpeta, nombreMTL, nombreOBJ, propScale, posX, posY, posZ, rotY = 0, propId = "") {
                const basePath = "../../../" + sourceRoot + "/" + carpeta + "/";
                const propMtlLoader = new THREE.MTLLoader();
                propMtlLoader.setPath(basePath);
                propMtlLoader.load(encodeURI(nombreMTL), (materials) => {
                    materials.preload();
                    const propObjLoader = new THREE.OBJLoader();
                    propObjLoader.setMaterials(materials);
                    propObjLoader.setPath(basePath);
                    propObjLoader.load(encodeURI(nombreOBJ), configurarProp, undefined, e => console.error("Error", nombreOBJ, e));
                }, undefined, e => {
                    const propObjLoader = new THREE.OBJLoader();
                    propObjLoader.setPath(basePath);
                    propObjLoader.load(encodeURI(nombreOBJ), configurarProp, undefined, err => console.error(err));
                });

                function configurarProp(obj) {
                    obj.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                const mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach(m => {
                                    m.side = THREE.DoubleSide;
                                    if (m.color && typeof m.color.setHex === 'function') m.color.setHex(0xffffff);
                                });
                            }
                        }
                    });
                    obj.scale.setScalar(propScale);
                    obj.position.set(posX, posY, posZ);
                    obj.rotation.y = rotY;
                    obj.userData.baseY = posY;
                    if (carpeta === "Moneda") {
                        obj.userData.coinId = propId || `coin-${coinSpawnIndex}`;
                        coinSpawnIndex += 1;
                    }
                    scene.add(obj);

                    if (carpeta === "Cactus") {
                        addObstacleCollider(obj);
                    }

                    if (carpeta === "Bote") window.escenarioPirata.botes.push(obj);
                    if (carpeta === "Moneda") window.escenarioPirata.monedas.push(obj);
                    if (carpeta !== "Moneda") window.escenarioPirata.props.push(obj);
                    if (carpeta === "Moneda") {
                        applyPendingCollectedCoins();
                    }
                }
            }

            // Arbol de prueba: cambia estos valores para ajustar posicion y escala.
            const testTreeX = -70;

            cargarProp("Models3", "arbol3", "arbol3.mtl", "arbol3.obj", testTree2Scale, testTree2X, testTree2Y, testTree2Z, testTree2RotationY);

            cargarProp("Models3", "arbol3", "arbol3.mtl", "arbol3.obj", testTree3Scale, testTree3X, testTree3Y, testTree3Z, testTree3RotationY);

            const testTree4RotationY = 2.2;
            const testTree4Y = getTerrainHeightAt(testTree4X, testTree4Z) - 1.2;
            cargarProp("Models3", "arbol3", "arbol3.mtl", "arbol3.obj", testTree4Scale, testTree4X, testTree4Y, testTree4Z, testTree4RotationY);

            const testTree5X = 4;
            const testTree5Z = 82;
            const testTree5Scale = 0.04;
            const testTree5RotationY = -2.4;
            const testTree5Y = getTerrainHeightAt(testTree5X, testTree5Z) - 1.2;
            cargarProp("Models3", "arbol3", "arbol3.mtl", "arbol3.obj", testTree5Scale, testTree5X, testTree5Y, testTree5Z, testTree5RotationY);

            // Sofas de prueba: cambia estos valores para ajustar posicion y escala.
            const sofaAX = -8;

            const sofaAScale = 3;
            const sofaARotationY = Math.PI / 7;
            const sofaAY = getTerrainHeightAt(sofaAX, sofaAZ);
            cargarProp("Models3", "Sofa A", "Queen Sofa A.mtl", "Queen Sofa A.obj", sofaAScale, sofaAX, sofaAY, sofaAZ, sofaARotationY);

            const sofaBX = 8;
            const sofaBZ = 9;
            const sofaBScale = 3;
            const sofaBRotationY = -Math.PI / 7;
            const sofaBY = getTerrainHeightAt(sofaBX, sofaBZ);
            cargarProp("Models3", "Sofa B", "Queen Sofa B.mtl", "Queen Sofa B.obj", sofaBScale, sofaBX, sofaBY, sofaBZ, sofaBRotationY);

            // Estatuas y guardias de prueba: cambia X/Z/Scale/RotationY para acomodarlos.
            const statueHeartX = -42;
            const statueHeartZ = -14;
            const statueHeartScale = 2.5;
            const statueHeartRotationY = Math.PI / 3;
            const statueHeartY = getTerrainHeightAt(statueHeartX, statueHeartZ);
            cargarProp("Models3", "EstatuaCorazon", "Queen Statue A.mtl", "Queen Statue A.obj", statueHeartScale, statueHeartX, statueHeartY, statueHeartZ, statueHeartRotationY);

            const statueSpadeX = 38;
            const statueSpadeZ = -26;
            const statueSpadeScale = 2.5;
            const statueSpadeRotationY = -Math.PI / 4;
            const statueSpadeY = getTerrainHeightAt(statueSpadeX, statueSpadeZ);
            cargarProp("Models3", "EstatuaPica", "Queen Statue B.mtl", "Queen Statue B.obj", statueSpadeScale, statueSpadeX, statueSpadeY, statueSpadeZ, statueSpadeRotationY);

            const statueDiamondX = -36;
            const statueDiamondZ = 36;
            const statueDiamondScale = 2.5;
            const statueDiamondRotationY = Math.PI / 2;
            const statueDiamondY = getTerrainHeightAt(statueDiamondX, statueDiamondZ);
            cargarProp("Models3", "EstatuaDiamante", "Queen Statue C.mtl", "Queen Statue C.obj", statueDiamondScale, statueDiamondX, statueDiamondY, statueDiamondZ, statueDiamondRotationY);

            const statueClubX = 34;

            const statueClubY = getTerrainHeightAt(statueClubX, statueClubZ);
            cargarProp("Models3", "EstatuaTrebol", "Queen Statue D.mtl", "Queen Statue D.obj", statueClubScale, statueClubX, statueClubY, statueClubZ, statueClubRotationY);

            const guardSpadeX = -18;
            const guardSpadeZ = 24;
            const guardSpadeScale = 2.2;
            const guardSpadeRotationY = Math.PI / 8;
            const guardSpadeY = getTerrainHeightAt(guardSpadeX, guardSpadeZ);
            cargarProp("Models3", "GuardiaPicaGris", "GuardiaPicaGris.mtl", "GuardiaPicaGris.obj", guardSpadeScale, guardSpadeX, guardSpadeY, guardSpadeZ, guardSpadeRotationY);

            const guardDiamondX = 22;
            const guardDiamondZ = -4;
            const guardDiamondScale = 2.2;
            const guardDiamondRotationY = -Math.PI / 8;
            const guardDiamondY = getTerrainHeightAt(guardDiamondX, guardDiamondZ);
            cargarProp("Models3", "GuardiaRomboRojo", "Card Guard Club.mtl", "Card Guard Club.obj", guardDiamondScale, guardDiamondX, guardDiamondY, guardDiamondZ, guardDiamondRotationY);

        };

        const keys = { w: false, a: false, s: false, d: false, shift: false, control: false, " ": false };
        let moveSpeed = 0.15;
        const baseSpeed = 0.15;
        const runSpeed = 0.3;
        const crouchSpeed = 0.075;
        const rotateSpeed = 0.05;
        let velocityY = 0;
        const gravity = -0.015;
        const jumpForce = 0.3;
        let isGrounded = true;

        let isRightMouseDown = false;
        let cameraAzimuth = 0;
        let cameraPolar = Math.PI / 4;
        let cameraDistance = 10;

        window.addEventListener('mousedown', (e) => { if (e.button === 2) isRightMouseDown = true; });
        window.addEventListener('mouseup', (e) => { if (e.button === 2) isRightMouseDown = false; });
        window.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('wheel', (e) => {
            cameraDistance += e.deltaY * 0.01;
            cameraDistance = Math.max(3, Math.min(40, cameraDistance)); // Limitar zoom in (3) y zoom out (40)
        });
        window.addEventListener('mousemove', (e) => {
            if (isRightMouseDown) {
                cameraAzimuth -= e.movementX * 0.005;
                cameraPolar = Math.max(0.1, Math.min(Math.PI / 2.1, cameraPolar + e.movementY * 0.005));
            }
        });

        window.addEventListener('keydown', (e) => {
            if (isGameOver) {
                return;
            }

            if (e.key === "Escape" || e.key === "Esc") {
                if (pauseOptionsModal.classList.contains("is-open")) {
                    closePauseOptionsButton.click();
                } else if (chatPopup.classList.contains("is-open")) {
                    closeChatButton.click();
                } else if (reactionsPopup.classList.contains("is-open")) {
                    closeReactionsButton.click();
                } else if (inventoryPopup.classList.contains("is-open")) {
                    closeInventoryButton.click();
                } else if (pauseModal.classList.contains("is-open")) {
                    pauseResumeButton.click();
                } else {
                    pauseButton.click();
                }
                return;
            }

            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
            if (e.shiftKey || e.key === "Shift") keys.shift = true;
            if (e.key === " ") {
                keys[" "] = true;
                if (isGrounded && !keys.control) {
                    velocityY = jumpForce;
                    isGrounded = false;
                    handlePirateJumpAction();
                }
            }
            if (key === 'p' && !e.repeat) {
                tryStealCoin();
            }
            if (key === 'm') {
                alert(`Coordenadas del Pirata:\nX: ${playerGroup.position.x.toFixed(2)}\nY: ${playerGroup.position.y.toFixed(2)}\nZ: ${playerGroup.position.z.toFixed(2)}`);
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
            if (e.key === "Shift") keys.shift = false;
            if (e.key === "Control") keys.control = false;
            if (e.key === " ") keys[" "] = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver || isPaused) {
                renderer.render(scene, camera);
                return;
            }

            const delta = clock.getDelta();
            if (pirateMixer) {
                pirateMixer.update(delta);
            }

            const prevPosition = playerGroup.position.clone();

            if (keys.control) moveSpeed = crouchSpeed;
            else if (keys.shift) moveSpeed = runSpeed;
            else moveSpeed = baseSpeed;

            if (keys.w) playerGroup.translateZ(-moveSpeed);
            if (keys.s) playerGroup.translateZ(moveSpeed);
            if (keys.a) playerGroup.rotation.y += rotateSpeed;
            if (keys.d) playerGroup.rotation.y -= rotateSpeed;

            if (!isPirateJumping) {
                setPirateAction(getDesiredMoveActionName(), 0.12);
            }

            const walkCycle = Date.now() * (keys.shift && !keys.control ? 0.02 : 0.01);
            if (keys.control) {
                playerGroup.scale.set(1.0, 0.6, 1.0);
                playerVisual.position.y = 0;
            } else {
                playerGroup.scale.set(1.0, 1.0, 1.0);
                playerVisual.position.y = 0;
            }

            let terrainHeight = Math.sin(playerGroup.position.x / 18) * Math.cos(playerGroup.position.z / 16) * 3.3;
            terrainHeight += Math.sin((playerGroup.position.x + playerGroup.position.z) / 8) * 0.9;
            const dist = Math.sqrt(playerGroup.position.x**2 + playerGroup.position.z**2);
            let finalHeight = terrainHeight;
            if (dist > 70) finalHeight += (dist - 70) * 0.28;
            
            const floorLevel = finalHeight;
            velocityY += gravity;
            playerGroup.position.y += velocityY;

            if (playerGroup.position.y <= floorLevel) {
                playerGroup.position.y = floorLevel;
                velocityY = 0;
                isGrounded = true;
            }

            if (isObstacleCollision(playerGroup.position)) {
                playerGroup.position.x = prevPosition.x;
                playerGroup.position.z = prevPosition.z;
            }

            const angle = playerGroup.rotation.y + cameraAzimuth;
            const x = Math.sin(angle) * Math.cos(cameraPolar) * cameraDistance;
            const y = Math.sin(cameraPolar) * cameraDistance;
            const z = Math.cos(angle) * Math.cos(cameraPolar) * cameraDistance;

            camera.position.set(playerGroup.position.x + x, playerGroup.position.y + y, playerGroup.position.z + z);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            if (false && window.pirateShip) {
                const time = performance.now() * 0.001;
                window.pirateShip.position.y = 0.9 + Math.sin(time) * 0.15;
                window.pirateShip.rotation.x = Math.sin(time * 0.5) * 0.02;
                window.pirateShip.rotation.z = Math.cos(time * 0.5) * 0.02;
            }

            // Animar el escenario pirata
            if (window.escenarioPirata) {
                const time = performance.now() * 0.001;
                window.escenarioPirata.monedas.forEach((moneda, index) => {
                    moneda.rotation.y = time * 2 + index; // Que giren sobre sÃƒÂ­ mismas
                    moneda.position.y = (moneda.userData.baseY || 1.0) + Math.sin(time * 3 + index) * 0.05; // Que floten brillando un poco
                });
            }

            collectNearbyCoins();

            const now = performance.now();
            if (now - lastMultiplayerBroadcast > 90) {
                sendMultiplayerState("state");
                lastMultiplayerBroadcast = now;
            }

            updateFootstepSounds();
            renderer.render(scene, camera);
        }
        animate();

        chatForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const message = chatInput.value.trim();
            if (!message) {
                return;
            }

            addPlayerMessage(message);
            chatInput.value = "";
        });

        reactionItems.forEach(function (reactionButton) {
            reactionButton.addEventListener("click", function () {
                const reactionText = reactionButton.textContent.trim();
                if (!reactionText) {
                    return;
                }

                addPlayerMessage(reactionText);
                playReactionSound();
                reactionsPopup.classList.remove("is-open");
                chatPopup.classList.add("is-open");
            });
        });
    </script>
